<head>

<title>JABARFAR ARCADE | بازی‌های دورهمی</title>

<style>
:root{--bg:#070b08;--panel:#101810;--panel2:#151f16;--lime:#c7ff4a;--green:#39ff88;--white:#f4f7ef;--muted:#9eac9a;--line:#d7ffb326;--red:#ff526b;--gold:#ffd166;--shadow:0 25px 90px #0009}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 80% -15%,#1d351b 0,transparent 42%),var(--bg);color:var(--white);font-family:Estedad,Tahoma,sans-serif;overflow-x:hidden}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}::selection{background:var(--lime);color:#070b07}
body:before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background-image:linear-gradient(#c7ff4a09 1px,transparent 1px),linear-gradient(90deg,#c7ff4a09 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(#000,transparent 88%)}
.aurora{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}.orb{position:absolute;border-radius:50%;filter:blur(95px);opacity:.14;animation:drift 16s ease-in-out infinite alternate}.orb.a{width:420px;height:420px;background:#39ff88;top:-240px;right:-150px}.orb.b{width:360px;height:360px;background:#c7ff4a;bottom:-220px;left:-130px;animation-delay:-6s}@keyframes drift{to{transform:translate(65px,55px) scale(1.2)}}
.wrap{width:min(1200px,calc(100% - 42px));margin:auto}.top{height:76px;display:flex;align-items:center;position:sticky;top:0;z-index:40;background:#080d09db;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.top-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%}.brand{display:flex;align-items:center;gap:12px;font-weight:900}.brand-mark{width:42px;height:42px;display:grid;place-items:center;background:var(--lime);color:#080b08;clip-path:polygon(15% 0,85% 0,100% 50%,85% 100%,15% 100%,0 50%);font-size:24px;box-shadow:0 0 28px #c7ff4a55}.brand small{display:block;font:700 9px Orbitron;letter-spacing:2px;color:var(--lime);direction:ltr}.nav{display:flex;gap:5px}.nav button{border:0;background:transparent;color:#a8b2a5;padding:10px 13px;border-radius:9px;font-size:13px}.nav button:hover{color:var(--lime);background:#c7ff4a10}
.btn{border:1px solid transparent;background:var(--lime);color:#0a1008;font-weight:900;padding:12px 18px;border-radius:9px;transition:.22s;box-shadow:0 7px 25px #c7ff4a1b}.btn:hover{transform:translateY(-3px);box-shadow:0 12px 32px #c7ff4a36}.btn:active{transform:scale(.97)}.btn.dark{background:#ffffff08;color:var(--white);border-color:var(--line);box-shadow:none}.btn.dark:hover{border-color:#c7ff4a66;color:var(--lime)}.btn.red{background:var(--red);color:white}.btn.small{padding:8px 12px;font-size:12px}.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}

.page-title{padding:48px 0 25px}.page-title h1{font-size:clamp(36px,6vw,58px);margin:8px 0}.page-title p{color:var(--muted);line-height:2}.panel{border:1px solid var(--line);background:linear-gradient(145deg,#131b13,#0d120d);padding:23px;margin-bottom:15px;position:relative;overflow:hidden}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}.panel-title h2{font-size:22px;margin:0}.field label{display:block;font-size:12px;font-weight:800;color:#cbd6c6;margin-bottom:7px}.field input,.field select,.vote-row select{width:100%;border:1px solid #d7ffb326;background:#080e09;color:var(--white);padding:12px;border-radius:8px;outline:none}.field input:focus,.field select:focus,.vote-row select:focus{border-color:var(--lime);box-shadow:0 0 0 3px #c7ff4a12}.player-entry{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}.roster-head{display:flex;justify-content:space-between;margin-top:20px;color:#d9e5d3;font-size:13px}.roster-head span{color:var(--lime)}.player-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px;margin-top:13px}.player-card{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#ffffff08;border:1px solid var(--line);min-width:0}.player-avatar{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;background:#c7ff4a18;color:var(--lime);font-weight:900}.player-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:13px}.player-index,.player-role{color:var(--muted);font-size:11px}.player-card button{border:0;background:transparent;color:var(--red);font-size:22px}.player-card.is-dead{opacity:.45;text-decoration:line-through}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.actions>*{flex:1;min-width:140px}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--line);margin-top:12px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.game-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:42px 0 22px}.game-header h2{font-size:34px;margin:7px 0}.game-header p{color:var(--muted);font-size:13px;margin:0}.game-header .btn{flex:none}.scenario-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.scenario{padding:17px;text-align:right;background:#ffffff07;border:1px solid var(--line);color:var(--white);border-radius:9px}.scenario b,.scenario small{display:block}.scenario small{color:var(--muted);font-size:11px;margin-top:8px;line-height:1.8}.scenario.selected{border-color:var(--lime);background:#c7ff4a12;box-shadow:0 0 25px #c7ff4a12}.role-chips{display:flex;gap:8px;flex-wrap:wrap}.role-chip{border:1px solid #c7ff4a32;background:#c7ff4a0d;padding:8px 12px;border-radius:7px;font-size:12px}.role-chip b{color:var(--lime);margin-right:5px}.notice{border-right:3px solid var(--lime);background:#c7ff4a0a;padding:12px 15px;color:#d7e7c8;font-size:12px;line-height:2;margin:14px 0}.muted{color:var(--muted);font-size:13px;line-height:2}.secret-panel{text-align:center;max-width:680px;margin:15px auto 35px;padding:35px}.counter{font:800 11px Orbitron;color:var(--lime);direction:ltr}.secret-player{font-size:30px;font-weight:900;margin:20px 0}.secret-role{font-size:34px;font-weight:900;color:var(--lime);padding:22px;border:1px solid #c7ff4a4d;background:#c7ff4a0c;margin:20px 0;text-shadow:0 0 24px #c7ff4a35}.vote-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.vote{width:100%;text-align:right;padding:13px;border:1px solid var(--line);background:#ffffff08;color:white;border-radius:8px}.vote:hover{border-color:var(--lime)}.vote small{color:var(--muted)}.vote-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.day-result{padding:15px;background:#ffffff08;border-radius:8px}.dead{color:var(--red)}.safe{color:var(--green)}.timer{font:800 clamp(48px,9vw,78px) Orbitron;text-align:center;color:var(--lime);text-shadow:0 0 30px #c7ff4a55;direction:ltr;margin:20px 0}.score-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.score{border:1px solid var(--line);background:#ffffff08;padding:14px;text-align:center}.score strong{display:block;font:800 32px Orbitron;color:var(--lime)}.topic-row{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.topic{border:1px solid var(--line);background:#ffffff07;color:#dbe6d4;padding:9px 14px;font-size:12px;border-radius:7px}.topic.active,.topic:hover{border-color:var(--lime);color:var(--lime);background:#c7ff4a12}
.modal{position:fixed;inset:0;z-index:100;background:#030603ed;backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modal-box{width:min(540px,100%);max-height:90vh;overflow:auto;padding:25px;border:1px solid #c7ff4a55;background:#111a10;box-shadow:0 25px 100px #000;animation:appear .3s}.toast{position:fixed;z-index:130;bottom:20px;left:50%;transform:translate(-50%,100px);opacity:0;background:#182417;border:1px solid #c7ff4a55;color:white;padding:12px 18px;transition:.3s;max-width:90vw}.toast.show{transform:translate(-50%,0);opacity:1}
.footer{padding:24px 0 32px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;color:#75816e;font-size:11px}.footer b{color:#c5d3b7}
@media(max-width:850px){.nav{display:none}.hero{grid-template-columns:1fr;text-align:center}.hero-copy{text-align:center}.hero-copy p{margin:auto}.micro{justify-content:center}.hero-buttons,.hero-meta{justify-content:center}.arcade-art{height:300px}.game-grid,.game-grid.compact{grid-template-columns:repeat(2,1fr)}.scenario-grid{grid-template-columns:1fr 1fr}}
