<style>
:root{--bg:#080b12;--panel:#101722;--panel2:#151f2d;--line:#ffffff18;--text:#f5f7fb;--muted:#9ba9b9;--gold:#ffc76a;--red:#ff536b;--cyan:#55e7e2;--green:#65e6a8;--blue:#5799ff;--shadow:0 24px 80px #0009}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 5%,#1d4b5045,transparent 34%),radial-gradient(ellipse at 88% 40%,#653b2530,transparent 34%),var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;overflow-x:hidden}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}
#fx{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}.glow{position:absolute;width:35vw;height:35vw;min-width:220px;min-height:220px;border-radius:50%;filter:blur(100px);opacity:.13;animation:float 18s ease-in-out infinite alternate}.g1{background:#43d9d2;top:-16%;right:-9%}.g2{background:#d18a3c;bottom:-18%;left:-10%;animation-delay:-7s}.g3{background:#5e85e8;top:44%;left:48%;width:22vw;height:22vw;animation-delay:-11s}@keyframes float{to{transform:translate(45px,60px) scale(1.18)}}.grain{position:absolute;inset:0;background-image:radial-gradient(#fff8 1px,transparent 1px);background-size:73px 73px;opacity:.1;animation:stars 32s linear infinite}@keyframes stars{to{background-position:146px 146px}}
.shell{width:min(1180px,100%);margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 17px;border:1px solid var(--line);border-radius:21px;background:#111a26d9;backdrop-filter:blur(20px);box-shadow:var(--shadow);position:sticky;top:9px;z-index:30}.brand{display:flex;align-items:center;gap:12px;font:30px Lalezar}.brand-icon{width:46px;height:46px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,#173c45,#8a592b);box-shadow:0 0 30px #55e7e233;font-size:26px}.nav{display:flex;gap:5px;flex-wrap:wrap}.nav button{background:transparent;color:var(--muted);border-radius:11px;padding:9px 12px;font-size:13px;font-weight:800;transition:.2s}.nav button:hover,.nav button.active{background:#ffffff12;color:white}
.page{animation:enter .5s cubic-bezier(.2,.8,.2,1)}@keyframes enter{from{opacity:0;transform:translateY(17px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}.hero{position:relative;overflow:hidden;text-align:center;margin:22px 0;padding:58px 20px;border:1px solid #ffffff20;border-radius:32px;background:linear-gradient(125deg,#142b32,#182332 55%,#34251d);box-shadow:0 28px 90px #0008}.hero:before,.hero:after{content:"";position:absolute;width:380px;height:380px;border:1px solid #ffffff19;border-radius:50%;top:-250px;right:-100px;animation:spin 28s linear infinite}.hero:after{width:280px;height:280px;top:auto;right:auto;bottom:-210px;left:-80px;animation-direction:reverse}@keyframes spin{to{transform:rotate(360deg)}}.hero>*{position:relative;z-index:1}.eyebrow{font:19px Lalezar;color:var(--gold);letter-spacing:1px}.hero h1{font:clamp(43px,8vw,76px)/1.12 Lalezar;margin:12px 0;text-shadow:0 0 35px #ffc76a30}.hero p{max-width:650px;margin:0 auto;color:#c3cfda;line-height:2}.skull{font:64px Lalezar;color:var(--gold);text-shadow:0 0 30px #ffc76a77;animation:skull 3s ease-in-out infinite}@keyframes skull{50%{transform:translateY(-8px) rotate(-4deg);filter:drop-shadow(0 0 16px #ffc76a88)}}
h2,h3{font-family:Lalezar;font-weight:400}h2{font-size:28px;margin:0 0 12px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 14px}.head h2{margin:0}.muted{color:var(--muted);line-height:1.9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:15px}.card{position:relative;overflow:hidden;padding:21px;border:1px solid var(--line);border-radius:23px;background:linear-gradient(145deg,#172332ed,#101722ed);box-shadow:0 17px 55px #0005;transition:.28s}.card:hover{transform:translateY(-4px);border-color:#ffc76a55;box-shadow:0 24px 65px #0007,0 0 25px #ffc76a0c}.game{min-height:235px;display:flex;flex-direction:column;justify-content:space-between}.symbol{font-size:47px;color:var(--gold);filter:drop-shadow(0 0 15px #ffc76a44)}.game h3{font-size:27px;margin:7px 0}.game p{font-size:13px;color:var(--muted);line-height:1.9}
.btn{border:0;border-radius:13px;padding:12px 17px;background:linear-gradient(110deg,#a76d34,#e6ad57);color:#1c140a;font-weight:900;box-shadow:0 8px 25px #d99c4230;transition:.2s}.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.btn:active{transform:scale(.97)}.btn.cyan{background:linear-gradient(110deg,#168d91,#56e3dc);color:#061c20}.btn.blue{background:linear-gradient(110deg,#326dc1,#68a8ff);color:#07172b}.btn.red{background:linear-gradient(110deg,#b82e49,#ff6479);color:white}.btn.green{background:linear-gradient(110deg,#168e69,#65e6a8);color:#06251b}.btn.ghost{background:#ffffff0b;border:1px solid var(--line);color:var(--text);box-shadow:none}.btn.full{width:100%;margin-top:9px}.btn.small{padding:8px 11px;font-size:12px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.actions>*{flex:1;min-width:125px}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:7px;color:#d7e0e8}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid #ffffff22;border-radius:13px;background:#0a111a;color:white;outline:none}.field input:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #55e7e21a}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}.pill{display:inline-flex;padding:6px 11px;border:1px solid var(--line);border-radius:40px;background:#ffffff0b;color:#d5e0e9;font-size:12px}.notice{padding:13px 15px;border:1px solid #55e7e233;border-radius:14px;background:#55e7e20b;color:#c7fffa;line-height:1.9;margin:12px 0}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.player{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px;border:1px solid var(--line);border-radius:13px;background:#ffffff08}.player button{border:0;background:transparent;color:#ff8b9a;font-size:18px}.empty{text-align:center;padding:22px;color:var(--muted)}.separator{height:1px;background:var(--line);margin:17px 0}
.card-stage{width:min(280px,80vw);height:370px;margin:20px auto;perspective:1200px}.playing-card{height:100%;width:100%;position:relative;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.2,.8,.2,1);cursor:pointer}.playing-card.flip{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;border:1px solid #ffffff35;border-radius:25px;backface-visibility:hidden;overflow:hidden}.front{background:radial-gradient(circle at 50% 20%,#37525a,#111c29 68%);box-shadow:0 20px 60px #0009,0 0 35px #55e7e222}.front:before{content:"";position:absolute;inset:12px;border:1px solid #ffffff2b;border-radius:17px}.front .seal{font-size:86px;color:var(--gold);text-shadow:0 0 30px #ffc76a77}.front strong{font:28px Lalezar}.front small{color:#b7c7d2;margin-top:7px}.back{transform:rotateY(180deg);background:radial-gradient(circle at 50% 15%,#3b6b66,#111b29 70%)}.back.bad{background:radial-gradient(circle at 50% 15%,#7c3541,#241622 75%)}.back h2{font:36px Lalezar;margin:10px 0}.role-icon{font-size:72px;color:var(--gold);filter:drop-shadow(0 0 20px #ffc76a66)}.timer{font:clamp(50px,9vw,78px) Lalezar;text-align:center;color:var(--cyan);font-variant-numeric:tabular-nums;text-shadow:0 0 28px #55e7e266}.timer.danger{color:var(--red);animation:alarm .65s infinite}@keyframes alarm{50%{opacity:.45;transform:scale(1.04)}}.bar{height:8px;background:#ffffff13;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--cyan));transition:width .5s}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:9px}.topic{padding:14px 9px;border:1px solid var(--line);border-radius:15px;background:#ffffff08;color:white}.topic.active,.topic:hover{border-color:var(--cyan);background:#55e7e212}.word{font:clamp(30px,6vw,52px) Lalezar;color:var(--gold);margin:14px 0}.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:10px}.score{padding:15px;border:1px solid var(--line);border-radius:16px;background:#ffffff08;text-align:center}.score strong{display:block;font:38px Lalezar;color:var(--gold)}.vote{width:100%;text-align:right;padding:13px;margin:5px 0;border:1px solid var(--line);border-radius:12px;background:#ffffff08;color:white}.vote:hover{border-color:var(--cyan)}.result{text-align:center;padding:17px;border:1px solid var(--line);border-radius:17px;background:#ffffff08;margin:12px 0}.result-symbol{font-size:68px;color:var(--gold);filter:drop-shadow(0 0 25px #ffc76a66);animation:pop .5s ease}@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.modal{position:fixed;inset:0;z-index:100;background:#02060bdc;backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modal-box{width:min(570px,100%);max-height:88vh;overflow:auto;padding:23px;border:1px solid #ffffff28;border-radius:24px;background:#14202d;box-shadow:var(--shadow);animation:pop .3s}.toast{position:fixed;z-index:150;bottom:20px;left:50%;transform:translate(-50%,100px);opacity:0;padding:12px 18px;border:1px solid var(--line);border-radius:13px;background:#1a2937;box-shadow:var(--shadow);transition:.3s;max-width:90vw}.toast.show{transform:translate(-50%,0);opacity:1}footer{text-align:center;color:#778796;font-size:12px;padding:30px 10px}
@media(max-width:720px){.shell{padding:9px}.top{position:relative;top:0;flex-direction:column}.nav{justify-content:center}.nav button{font-size:12px;padding:8px}.hero{padding:42px 15px}.grid{grid-template-columns:1fr 1fr}.game{min-height:240px}}
@media(max-width:480px){.grid{grid-template-columns:1fr}.brand{font-size:26px}.hero h1{font-size:43px}.card-stage{height:345px}.actions .btn{min-width:100%}.players{grid-template-columns:1fr 1fr}}
</style></head>
<body><div id="fx"><div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div><div class="grain"></div></div>
<div class="shell"><header class="top"><div class="brand"><div class="brand-icon">☠</div><span>بازی مخصوص خانواده جبارفر</span></div><nav class="nav" id="nav"></nav></header><main id="app"></main><footer>☠ بازی مخصوص خانواده جبارفر · طراحی و توسعه: امیر حسین جبارفر</footer></div>
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),app=$('#app'),nav=$('#nav'),modal=$('#modal'),modalBox=$('#modalBox');
const state={page:'home',players:[],spy:{players:[],roles:[],word:'',idx:0,spyCount:1,votes:[],seconds:120,timer:null},mafia:{players:[],roles:[],idx:0,night:1},pant:{teams:['گروه آ','گروه ب'],score:[0,0],team:0,round:1,rounds:5,seconds:60,total:60,word:'',timer:null,used:[]},bomb:{players:[],seconds:30,timer:null,current:0},word:{used:[]}};
const menus=[['home','⌂ خانه'],['spy','جاسوس'],['mafia','مافیا'],['pant','پانتومیم'],['bomb','بمب'],['word','حدس کلمه']];
nav.innerHTML=menus.map(([p,t])=>'<button data-page="'+p+'">'+t+'</button>').join('');
const words={مکان:['بیمارستان','فرودگاه','مدرسه','کتابخانه','رستوران','سینما','پارک آبی','ایستگاه قطار','هتل','موزه','آرایشگاه','استادیوم','بانک','آکواریوم','کوهستان','جزیره','کارخانه','دادگاه','دانشگاه','پمپ بنزین'],خوراکی:['قرمه‌سبزی','پیتزا','بستنی','زرشک‌پلو','کباب','ماکارونی','آش رشته','فلافل','همبرگر','شیرینی','انار','هندوانه','املت','ته‌چین'],وسیله:['چتر','دوچرخه','تلسکوپ','ساعت','هدفون','چمدان','دوربین','یخچال','کتری','چراغ‌قوه','پیانو','مداد','آینه','چتر'],شغل:['پزشک','معلم','بازیگر','خلبان','آتش‌نشان','نقاش','آشپز','فضانورد','برنامه‌نویس','عکاس'],طبیعت:['آبشار','آتشفشان','جنگل','رنگین‌کمان','دریاچه','غار','کویر','برف','گردباد','ماه'],ورزش:['فوتبال','بسکتبال','شنا','تنیس','والیبال','کشتی','شطرنج','دوچرخه‌سواری']};
const pantWords={فیلم:['مرد عنکبوتی','شیرشاه','تایتانیک','هری پاتر','ماتریکس','پدرخوانده','راتاتویی','عصر یخبندان'],شغل:['آتش‌نشان','دندان‌پزشک','خلبان','آشپز','عکاس','بازیگر','معلم','نجار'],حیوانات:['فیل','پنگوئن','کانگورو','زرافه','اختاپوس','طاووس','میمون','لاک‌پشت'],کارها:['مسواک زدن','دوچرخه‌سواری','ماهیگیری','آشپزی','خوابیدن','اسکی کردن','عکاسی','شنا کردن'],اشیا:['چتر','جاروبرقی','پیانو','تلفن','ساعت','عینک','چمدان','چراغ‌قوه']};
const mafiaRoles=[['مافیا','☠','تیم مافیا'],['مافیا','☠','تیم مافیا'],['دکتر','✚','شهروند'],['کارآگاه','⌕','شهروند'],['شهروند','♙','شهروند'],['شهروند','♙','شهروند'],['شهروند','♙','شهروند'],['محافظ','⬡','شهروند'],['اسنایپر','◎','شهروند']];
const $esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function random(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function fmt(n){return String(Math.max(0,n)).padStart(2,'0').replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[+d])}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2300)}
function stopTimers(){['spy','pant','bomb'].forEach(k=>{if(state[k].timer){clearInterval(state[k].timer);state[k].timer=null}})}
function go(p){stopTimers();state.page=p;render();nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));window.scrollTo({top:0,behavior:'smooth'})}
nav.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
function hero(k,t,d){return '<section class="hero"><div class="skull">☠</div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p>'+d+'</p></section>'}
function game(icon,title,desc,page,label){return '<article class="card game"><div><div class="symbol">'+icon+'</div><h3>'+title+'</h3><p>'+desc+'</p></div><button class="btn full" data-page="'+page+'">'+label+'</button></article>'}
function home(){app.innerHTML='<section class="page">'+hero('THE JABARFAR FAMILY GAME NIGHT','بازی مخصوص خانواده جبارفر','یک شب پر از رمز، خنده، رقابت و کارت‌های مخفی! بازیکن‌ها را جمع کنید و بازی دلخواهتان را شروع کنید.')+'<div class="head"><h2>مجموعه بازی‌ها</h2><span class="pill">۶ بازی دورهمی</span></div><div class="grid">'+game('☠','جاسوس','نقش‌ها را مخفیانه تقسیم کن، جاسوس را پیدا کن و قبل از لو رفتن کلمه را حدس بزن.','spy','ورود به مأموریت')+game('♟','مافیا','کارت‌های نقش حرفه‌ای، شب و روز و تقسیم تیم شهروند و مافیا.','mafia','پخش کارت‌ها')+game('🎭','پانتومیم','موضوع تصادفی، تایمر و رقابت دو تیم با امتیازدهی.','pant','شروع مسابقه')+game('💣','بمب','بمب تایمری خیالی را قبل از پایان زمان به نفر بعدی پاس بدهید!','bomb','شروع چالش')+game('🧠','حدس کلمه','یک نفر کلمه را توضیح می‌دهد و بقیه در زمان محدود حدس می‌زنند.','word','شروع بازی')+game('🎲','قوانین دورهمی','راهنمای سریع و قوانین پیشنهادی برای اجرای بازی‌ها.','rules','مشاهده قوانین')+'</div><div class="notice">✦ نکته: برای بازی جاسوس و مافیا، گوشی را به نوبت به هر بازیکن بدهید تا کارت خودش را ببیند؛ دیگران صفحه را نگاه نکنند.</div></section>'}
function playerEditor(title,desc,gameKey='players'){app.innerHTML='<section class="page">'+hero('PLAYER LOBBY',title,desc)+'<div class="card"><div class="field"><label>نام بازیکن</label><div class="row"><input id="playerName" maxlength="22" placeholder="مثلاً امیر..."><button class="btn cyan" data-action="add-player">افزودن بازیکن</button></div></div><div class="head"><h2>بازیکنان حاضر</h2><span class="pill" id="playerCount">۰ نفر</span></div><div class="players" id="playerList"></div><div class="actions"><button class="btn ghost" data-action="clear-players">پاک کردن فهرست</button><button class="btn" data-action="start-'+gameKey+'">ادامه و تقسیم نقش</button></div></div></section>';renderPlayers()}
function renderPlayers(){const el=$('#playerList');if(!el)return;el.innerHTML=state.players.map((n,i)=>'<div class="player"><span>'+(i+1)+'. '+$esc(n)+'</span><button data-action="remove-player" data-i="'+i+'">×</button></div>').join('')||'<div class="empty">هنوز بازیکنی اضافه نشده است.</div>';$('#playerCount').textContent=fmt(state.players.length)+' نفر'}
function addPlayer(){const v=$('#playerName').value.trim();if(!v)return toast('نام بازیکن را وارد کن.');if(state.players.includes(v))return toast('این نام قبلاً اضافه شده.');if(state.players.length>=20)return toast('حداکثر ۲۰ بازیکن.');state.players.push(v);$('#playerName').value='';renderPlayers()}
function removePlayer(i){state.players.splice(i,1);renderPlayers()}
function setupSpy(){playerEditor('مأموریت جاسوس','بازیکن‌ها را وارد کن؛ سپس کارت‌های محرمانه به صورت تصادفی پخش می‌شوند.')}
function startSpy(){if(state.players.length<4)return toast('برای جاسوس حداقل ۴ بازیکن لازم است.');const s=state.spy;s.players=[...state.players];s.spyCount=Math.max(1,Math.min(3,Number($('#spyCount')?.value||1)));if(s.spyCount>=s.players.length)return toast('تعداد جاسوس‌ها باید کمتر از تعداد بازیکنان باشد.');const cat=$('#spyCategory')?.value||'همه';const bank=cat==='همه'?Object.values(words).flat():words[cat];s.word=random(bank);s.roles=shuffle([...Array(s.players.length-s.spyCount).fill('شهروند'),...Array(s.spyCount).fill('جاسوس')]);s.idx=0;s.votes=[];spyCard()}
function spyCard(){const s=state.spy;if(s.idx>=s.players.length){spyDiscussion();return}const role=s.roles[s.idx];app.innerHTML='<section class="page">'+hero('SECRET IDENTITY','کارت محرمانه','گوشی را فقط به '+$esc(s.players[s.idx])+' بدهید. کارت را لمس کن تا نقش نمایش داده شود.')+'<div class="card"><div class="pill">بازیکن '+fmt(s.idx+1)+' از '+fmt(s.players.length)+'</div><div class="card-stage"><div class="playing-card" id="roleCard" data-action="flip-card"><div class="face front"><div class="seal">☠</div><strong>کارت محرمانه</strong><small>برای مشاهده لمس کن</small></div><div class="face back '+(role==='جاسوس'?'bad':'')+'"><div class="role-icon">'+(role==='جاسوس'?'☠':'♙')+'</div><h2>'+role+'</h2><p>'+(role==='جاسوس'?'تو کلمه را نمی‌دانی؛ با دقت سؤال بپرس!':'کلمه مخفی را پیدا کن و جاسوس را لو بده.')+'</p>'+(role==='شهروند'?'<div class="word">'+$esc(s.word)+'</div>':'')+'</div></div></div><p class="muted" style="text-align:center">پس از دیدن کارت، آن را ببند و گوشی را به نفر بعد بده.</p><button class="btn cyan full" data-action="spy-next">کارت بعدی</button></div></section>'}
function spyDiscussion(){const s=state.spy;app.innerHTML='<section class="page">'+hero('DISCUSSION TIME','زمان گفت‌وگو','همه بازیکنان به نوبت سؤال بپرسند و درباره هویت جاسوس‌ها بحث کنند.')+'<div class="card"><div class="field"><label>مدت گفت‌وگو</label><select id="spyDuration"><option value="60">۱ دقیقه</option><option value="120" selected>۲ دقیقه</option><option value="180">۳ دقیقه</option><option value="300">۵ دقیقه</option></select></div><div class="timer" id="spyTimer">۰۲:۰۰</div><button class="btn cyan full" data-action="spy-timer">شروع تایمر</button><button class="btn full" data-action="spy-vote">رفتن به رأی‌گیری</button></div></section>'}
function spyTimer(){const s=state.spy;if(s.timer)return;let n=Number($('#spyDuration').value);$('#spyTimer').textContent='۰'+fmt(Math.floor(n/60))+':'+fmt(n%60);s.timer=setInterval(()=>{n--;const e=$('#spyTimer');if(e)e.textContent='۰'+fmt(Math.floor(n/60))+':'+fmt(n%60);if(n<=0){clearInterval(s.timer);s.timer=null;toast('زمان گفت‌وگو تمام شد!')}},1000)}
function spyVote(){const s=state.spy;s.votes=[];let counts={};s.players.forEach((n,i)=>counts[n]=0);const suspects=s.players.map((n,i)=>'<button class="vote" data-action="spy-vote-pick" data-i="'+i+'">'+$esc(n)+'</button>').join('');app.innerHTML='<section class="page">'+hero('VOTING','رأی‌گیری نهایی','همه با هم رأی بدهید و فرد مشکوک را انتخاب کنید.')+'<div class="card"><div class="notice">رأی‌ها را با توافق جمع ثبت کنید؛ انتخاب هر بازیکن فقط یک بار ممکن است.</div>'+suspects+'<div id="votes"></div><button class="btn cyan full" data-action="spy-result">نمایش نتیجه</button></div></section>';s.voteCounts=counts}
function spyPick(i){const s=state.spy;s.voteCounts[s.players[i]]++;$('#votes').innerHTML=Object.entries(s.voteCounts).map(([n,v])=>'<div class="player"><span>'+ $esc(n)+'</span><b>'+fmt(v)+' رأی</b></div>').join('')}
function spyResult(){const s=state.spy;const sorted=Object.entries(s.voteCounts).sort((a,b)=>b[1]-a[1]);const caught=sorted[0]&&s.roles[s.players.indexOf(sorted[0][0])]==='جاسوس';app.innerHTML='<section class="page">'+hero('MISSION RESULT','نتیجه مأموریت','هویت‌ها و کلمه مخفی آشکار شدند.')+'<div class="card result"><div class="result-symbol">'+(caught?'🏆':'☠')+'</div><h2>'+(caught?'شهروندها برنده شدند!':'جاسوس‌ها فرار کردند!')+'</h2><div class="word">'+$esc(s.word)+'</div><div class="separator"></div>'+s.players.map((n,i)=>'<div class="player"><span>'+$esc(n)+'</span><b>'+(s.roles[i]==='جاسوس'?'☠ جاسوس':'♙ شهروند')+'</b></div>').join('')+'<button class="btn cyan full" data-page="spy">بازی دوباره</button></div></section>'}
function setupMafia(){playerEditor('اتاق تقسیم نقش مافیا','نقش‌های کلاسیک و ویژه را به شکل کارت محرمانه بین بازیکنان تقسیم کن.','mafia')}
function startMafia(){const m=state.mafia;m.players=[...state.players];if(m.players.length<5)return toast('برای مافیا حداقل ۵ بازیکن لازم است.');let roles=mafiaRoles.slice(0,Math.min(m.players.length,mafiaRoles.length));while(roles.length<m.players.length)roles.push(['شهروند','♙','شهروند']);m.roles=shuffle(roles);m.idx=0;m.night=1;mafiaCard()}
function mafiaCard(){const m=state.mafia;if(m.idx>=m.players.length){app.innerHTML='<section class="page">'+hero('GAME READY','همه نقش‌ها پخش شد','نقش‌ها را به خاطر بسپارید؛ گرداننده بازی شب اول را اعلام کند.')+'<div class="card"><div class="result-symbol">☠</div><h2>شب اول آغاز می‌شود</h2><p class="muted">مافیاها چشم باز کنند، یکدیگر را بشناسند و سپس به ترتیب نقش‌ها عمل کنند.</p><button class="btn cyan full" data-action="mafia-again">تقسیم نقش مجدد</button><button class="btn ghost full" data-page="home">بازگشت به خانه</button></div></section>';return}const r=m.roles[m.idx];app.innerHTML='<section class="page">'+hero('MAFIA · SECRET CARD','کارت نقش مافیا','گوشی را به '+$esc(m.players[m.idx])+' بده؛ فقط خودش کارت را ببیند.')+'<div class="card"><span class="pill">بازیکن '+fmt(m.idx+1)+' از '+fmt(m.players.length)+'</span><div class="card-stage"><div class="playing-card" id="roleCard" data-action="flip-card"><div class="face front"><div class="seal">☠</div><strong>کارت نقش</strong><small>برای دیدن لمس کن</small></div><div class="face back '+(r[2]==='تیم مافیا'?'bad':'')+'"><div class="role-icon">'+r[1]+'</div><h2>'+r[0]+'</h2><p>'+r[2]+'</p></div></div></div><button class="btn cyan full" data-action="mafia-next">کارت بعدی</button></div></section>'}
function setupPant(){app.innerHTML='<section class="page">'+hero('CHARADES ARENA','پانتومیم خانوادگی','دو تیم بسازید، موضوع انتخاب کنید و بدون حرف زدن کلمه را اجرا کنید.')+'<div class="card"><div class="row"><div class="field"><label>نام تیم اول</label><input id="teamA" value="تیم آذر"></div><div class="field"><label>نام تیم دوم</label><input id="teamB" value="تیم آتش"></div></div><div class="row"><div class="field"><label>تعداد دور</label><select id="rounds"><option>3</option><option selected>5</option><option>7</option><option>10</option></select></div><div class="field"><label>زمان هر نوبت</label><select id="pantTime"><option value="30">۳۰ ثانیه</option><option value="60" selected>۱ دقیقه</option><option value="90">۹۰ ثانیه</option></select></div></div><div class="field"><label>موضوع</label><div class="topic-grid">'+Object.keys(pantWords).map(t=>'<button class="topic" data-topic="'+t+'">'+t+'</button>').join('')+'</div></div><button class="btn cyan full" data-action="pant-start">ساخت مسابقه</button></div></section>'}
function pantStart(){const p=state.pant;p.teams=[$('#teamA').value.trim()||'تیم آ',$('#teamB').value.trim()||'تیم ب'];p.rounds=Number($('#rounds').value);p.total=Number($('#pantTime').value);p.score=[0,0];p.team=0;p.round=1;p.used=[];p.topic=p.topic||Object.keys(pantWords)[0];pantNext()}
function pantNext(){const p=state.pant;let bank=pantWords[p.topic].filter(w=>!p.used.includes(w));if(!bank.length){p.used=[];bank=pantWords[p.topic]}p.word=random(bank);p.used.push(p.word);p.seconds=p.total;pantTurn()}
function pantTurn(){const p=state.pant;app.innerHTML='<section class="page">'+hero('ROUND '+p.round,'نوبت '+$esc(p.teams[p.team]),'فقط اجراکننده کلمه را ببیند؛ با شروع تایمر فرصت اجرا آغاز می‌شود.')+'<div class="card"><div class="scoreboard"><div class="score">'+$esc(p.teams[0])+'<strong>'+p.score[0]+'</strong></div><div class="score">'+$esc(p.teams[1])+'<strong>'+p.score[1]+'</strong></div></div><div class="result" id="pantSecret"><button class="btn cyan" data-action="pant-show">نمایش کلمه برای اجراکننده</button></div><div class="timer" id="pantTimer">'+fmt(p.seconds)+'</div><div class="bar"><span id="pantBar" style="width:100%"></span></div><div class="actions"><button class="btn cyan" data-action="pant-clock">شروع تایمر</button><button class="btn green" data-action="pant-correct">حدس درست بود +۱</button><button class="btn red" data-action="pant-skip">رد کلمه</button></div></div></section>'}
function pantClock(){const p=state.pant;if(p.timer)return;p.timer=setInterval(()=>{p.seconds--;const e=$('#pantTimer');if(e){e.textContent=fmt(p.seconds);e.classList.toggle('danger',p.seconds<=10)}const b=$('#pantBar');if(b)b.style.width=p.seconds/p.total*100+'%';if(p.seconds<=0){clearInterval(p.timer);p.timer=null;pantFinish(false)}},1000)}
function pantFinish(ok){const p=state.pant;if(p.timer){clearInterval(p.timer);p.timer=null}if(ok)p.score[p.team]++;openModal('<div class="result"><div class="result-symbol">'+(ok?'✓':'⌛')+'</div><h2>'+(ok?'آفرین! یک امتیاز':'زمان تمام شد')+'</h2><p>کلمه: <b>'+ $esc(p.word)+'</b></p><div class="scoreboard"><div class="score">'+$esc(p.teams[0])+'<strong>'+p.score[0]+'</strong></div><div class="score">'+$esc(p.teams[1])+'<strong>'+p.score[1]+'</strong></div></div><button class="btn cyan full" data-action="pant-next">نوبت بعد</button></div>')}
function pantAdvance(){closeModal();const p=state.pant;p.team=1-p.team;if(p.team===0)p.round++;if(p.round>p.rounds){app.innerHTML='<section class="page">'+hero('CHAMPIONS','پایان مسابقه','نتیجه نهایی پانتومیم')+'<div class="card result"><div class="result-symbol">🏆</div><h2>'+(p.score[0]===p.score[1]?'مسابقه مساوی شد':$esc(p.teams[p.score[0]>p.score[1]?0:1])+' قهرمان شد!')+'</h2><div class="scoreboard"><div class="score">'+$esc(p.teams[0])+'<strong>'+p.score[0]+'</strong></div><div class="score">'+$esc(p.teams[1])+'<strong>'+p.score[1]+'</strong></div></div><button class="btn cyan full" data-page="pant">مسابقه جدید</button></div></section>'}else pantNext()}
function setupBomb(){app.innerHTML='<section class="page">'+hero('PASS THE PRESSURE','بمب تایمری','یک بازی سرعتی و کاملاً نمایشی؛ تایمر تصادفی است، بمب واقعی نیست. قبل از تمام شدن زمان گوشی را به نفر بعدی بده!')+'<div class="card"><div class="field"><label>نام بازیکنان (با ویرگول جدا کن)</label><input id="bombPlayers" placeholder="امیر، کیان، مهر، ..."></div><div class="row"><div class="field"><label>کمترین زمان (ثانیه)</label><select id="bombMin"><option>10</option><option selected>15</option><option>20</option></select></div><div class="field"><label>بیشترین زمان</label><select id="bombMax"><option>30</option><option selected>45</option><option>60</option></select></div></div><button class="btn cyan full" data-action="bomb-start">شروع چالش</button></div></section>'}
function bombStart(){const b=state.bomb;b.players=$('#bombPlayers').value.split(/[،,]/).map(x=>x.trim()).filter(Boolean);if(b.players.length<2)return toast('حداقل دو بازیکن وارد کن.');b.current=0;const min=Number($('#bombMin').value),max=Number($('#bombMax').value);b.seconds=Math.floor(Math.random()*(max-min+1))+min;bombScreen()}
function bombScreen(){const b=state.bomb;app.innerHTML='<section class="page">'+hero('QUICK! PASS IT!','بمب دست توست!','نفر بعدی را صدا کن و گوشی را سریع منتقل کن؛ قبل از پایان تایمر!')+'<div class="card" style="text-align:center"><span class="pill">نوبت '+fmt(b.current+1)+' · '+$esc(b.players[b.current%b.players.length])+'</span><div class="result-symbol">💣</div><div class="timer" id="bombTimer">'+fmt(b.seconds)+'</div><p class="muted">وقتی گوشی دست توست، دکمه پاس را بزن.</p><button class="btn cyan full" data-action="bomb-pass">پاس دادن به نفر بعدی</button><button class="btn ghost full" data-action="bomb-stop">پایان بازی</button></div></section>';b.timer=setInterval(()=>{b.seconds--;const e=$('#bombTimer');if(e){e.textContent=fmt(b.seconds);e.classList.toggle('danger',b.seconds<=5)}if(b.seconds<=0){clearInterval(b.timer);b.timer=null;bombEnd()}},1000)}
function bombPass(){const b=state.bomb;if(b.timer){clearInterval(b.timer);b.timer=null}b.current++;const min=12,max=40;b.seconds=Math.floor(Math.random()*(max-min+1))+min;bombScreen()}
function bombEnd(){const b=state.bomb;const loser=b.players[b.current%b.players.length];openModal('<div class="result"><div class="result-symbol">💥</div><h2>زمان تموم شد!</h2><p>این دور به نام <b>'+ $esc(loser)+'</b> ثبت شد.</p><button class="btn cyan full" data-action="bomb-again">دور بعدی</button><button class="btn ghost full" data-page="home">بازگشت به خانه</button></div>')}
function wordSetup(){app.innerHTML='<section class="page">'+hero('WORD CHALLENGE','حدس کلمه','یک نفر کلمه را می‌بیند و بدون گفتن خود کلمه آن را برای بقیه توضیح می‌دهد.')+'<div class="card"><div class="field"><label>دسته‌بندی</label><select id="wordCategory">'+Object.keys(words).map(t=>'<option>'+t+'</option>').join('')+'</select></div><div class="field"><label>زمان بازی</label><select id="wordDuration"><option value="30">۳۰ ثانیه</option><option value="60" selected>۱ دقیقه</option><option value="90">۹۰ ثانیه</option></select></div><button class="btn cyan full" data-action="word-next">نمایش کارت</button></div></section>'}
function wordNext(){const w=state.word,cat=$('#wordCategory')?.value||'مکان';let bank=words[cat].filter(x=>!w.used.includes(x));if(!bank.length){w.used=[];bank=words[cat]}w.word=random(bank);w.used.push(w.word);w.seconds=Number($('#wordDuration')?.value||60);wordCard()}
function wordCard(){const w=state.word;app.innerHTML='<section class="page">'+hero('SECRET WORD','کارت حدس کلمه','فقط راهنما کلمه را ببیند؛ سپس تایمر را روشن کنید.')+'<div class="card result"><div class="result-symbol">🧠</div><div class="word" id="wordSecret">••••••••</div><button class="btn ghost" data-action="word-reveal">نمایش کلمه</button><div class="timer" id="wordTimer">'+fmt(w.seconds)+'</div><div class="actions"><button class="btn cyan" data-action="word-clock">شروع تایمر</button><button class="btn green" data-action="word-correct">درست حدس زدند</button><button class="btn red" data-action="word-skip">کلمه بعدی</button></div></div></section>'}
function wordClock(){const w=state.word;if(w.timer)return;w.timer=setInterval(()=>{w.seconds--;const e=$('#wordTimer');if(e)e.textContent=fmt(w.seconds);if(w.seconds<=0){clearInterval(w.timer);w.timer=null;toast('زمان تمام شد!')}},1000)}
function rules(){app.innerHTML='<section class="page">'+hero('HOW TO PLAY','قوانین دورهمی','راهنمای سریع برای اجرای منصفانه و سرگرم‌کننده بازی‌ها.')+'<div class="grid"><div class="card"><h2>☠ جاسوس</h2><p class="muted">همه به جز جاسوس یک کلمه یکسان می‌بینند. با پرسش‌های غیرمستقیم جاسوس را پیدا کنید؛ جاسوس هم تلاش می‌کند کلمه را حدس بزند.</p></div><div class="card"><h2>♟ مافیا</h2><p class="muted">نقش‌ها مخفی‌اند. گرداننده شب و روز را مدیریت می‌کند. بازیکنان حذف‌شده نباید در بحث و رأی‌گیری دخالت کنند.</p></div><div class="card"><h2>🎭 پانتومیم</h2><p class="muted">اجراکننده حق حرف زدن یا نوشتن ندارد. تیم با حدس درست امتیاز می‌گیرد.</p></div><div class="card"><h2>💣 بمب</h2><p class="muted">یک تایمر تصادفی نمایشی فعال است. گوشی را به ترتیب بین نفرات پاس دهید؛ وقتی تایمر تمام شود، نوبت همان بازیکن ثبت می‌شود.</p></div></div></section>'}
function render(){if(state.page==='home')home();else if(state.page==='spy')setupSpy();else if(state.page==='mafia')setupMafia();else if(state.page==='pant')setupPant();else if(state.page==='bomb')setupBomb();else if(state.page==='word')wordSetup();else rules()}
function action(a,b){switch(a){
case'add-player':addPlayer();break;case'remove-player':removePlayer(+b.i);break;case'clear-players':state.players=[];renderPlayers();break;
case'start-players':startSpy();break;case'start-mafia':startMafia();break;
case'flip-card':$('#roleCard')?.classList.toggle('flip');break;case'spy-next':state.spy.idx++;spyCard();break;case'spy-timer':spyTimer();break;case'spy-vote':if(state.spy.timer){clearInterval(state.spy.timer);state.spy.timer=null}spyVote();break;case'spy-vote-pick':spyPick(+b.i);break;case'spy-result':spyResult();break;
case'mafia-next':state.mafia.idx++;mafiaCard();break;case'mafia-again':state.mafia.idx=0;state.mafia.roles=shuffle(state.mafia.roles);mafiaCard();break;
case'pant-start':pantStart();break;case'pant-show':$('#pantSecret').innerHTML='<div class="word">'+$esc(state.pant.word)+'</div>';break;case'pant-clock':pantClock();break;case'pant-correct':pantFinish(true);break;case'pant-skip':pantFinish(false);break;case'pant-next':pantAdvance();break;
case'bomb-start':bombStart();break;case'bomb-pass':bombPass();break;case'bomb-stop':if(state.bomb.timer)clearInterval(state.bomb.timer);state.bomb.timer=null;go('home');break;case'bomb-again':closeModal();bombStartAgain();break;
case'word-next':wordNext();break;case'word-reveal':$('#wordSecret').textContent=state.word.word;break;case'word-clock':wordClock();break;case'word-correct':if(state.word.timer)clearInterval(state.word.timer);toast('آفرین! امتیاز ثبت شد.');wordSetup();break;case'word-skip':if(state.word.timer)clearInterval(state.word.timer);wordNext();break;
}}
function bombStartAgain(){const b=state.bomb;b.seconds=Math.floor(Math.random()*26)+15;b.current++;bombScreen()}
document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){go(p.dataset.page);return}const t=e.target.closest('[data-topic]');if(t){state.pant.topic=t.dataset.topic;document.querySelectorAll('[data-topic]').forEach(x=>x.classList.toggle('active',x===t));return}const b=e.target.closest('[data-action]');if(b)action(b.dataset.action,b.dataset)});
$('#modal').addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show')});
go('home');
})();
</script></body></html>
