<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<title>خانواده لند | بازی‌های دورهمی</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f4f7ff;
  --surface:rgba(255,255,255,.94);
  --surface2:#ffffff;
  --text:#172033;
  --muted:#6e7890;
  --primary:#6d5dfc;
  --secondary:#18b9ff;
  --green:#10b981;
  --red:#ef4444;
  --orange:#ff9b42;
  --yellow:#f2c94c;
  --purple:#9a58ff;
  --border:#e7ebf3;
  --shadow:0 25px 80px rgba(65,82,145,.13);
}
html,body{margin:0;padding:0;min-height:100%;font-family:Tahoma,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{overflow-x:hidden;transition:.3s}
body.dark-night{background:#070a15;color:#f6f8ff}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
#background{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-10}
.orb{position:absolute;width:320px;height:320px;border-radius:50%;filter:blur(85px);opacity:.25;animation:moveOrb 13s ease-in-out infinite alternate}
.orb.a{background:#6d5dfc;right:-100px;top:-100px}
.orb.b{background:#18b9ff;left:-110px;bottom:-100px;animation-delay:2s}
.orb.c{background:#ff9b42;left:43%;top:40%;animation-delay:4s}
@keyframes moveOrb{to{transform:translate(60px,50px) scale(1.2)}}
.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:#6d5dfc;opacity:.15;animation:particle 10s linear infinite}
@keyframes particle{from{transform:translateY(105vh) scale(.4)}to{transform:translateY(-10vh) scale(1.5)}}
.container{width:min(1450px,100%);margin:0 auto;padding:14px}
header{position:sticky;top:10px;z-index:100;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.85);border-radius:26px;box-shadow:var(--shadow);margin-bottom:18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px;white-space:nowrap}
.logoIcon{width:46px;height:46px;border-radius:16px;color:white;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--secondary));box-shadow:0 10px 35px #6d5dfc40;font-size:24px}
.nav{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.nav button{padding:9px 11px;background:transparent;color:var(--muted);border-radius:13px;font-weight:900;transition:.2s}
.nav button:hover,.nav button.active{background:#fff;color:var(--primary);box-shadow:0 8px 22px #24345b10}
.page{animation:pageIn .42s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(14px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.hero{position:relative;overflow:hidden;color:white;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:34px;padding:42px 20px;text-align:center;box-shadow:0 28px 90px #4c68c22b}
.hero:before,.hero:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.18);border-radius:50%;pointer-events:none}
.hero:before{width:480px;height:480px;left:-200px;top:-230px;animation:spin 12s linear infinite}
.hero:after{width:340px;height:340px;right:-170px;bottom:-180px;animation:spin 9s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.hero > *{position:relative;z-index:1}
.heroIcon{font-size:56px;margin-bottom:8px}
.hero h1{font-size:clamp(40px,7vw,72px);line-height:1.15;margin:0 0 10px;font-weight:900}
.hero p{max-width:900px;margin:0 auto;line-height:2}
.hero .heroBtns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:18px;margin-top:18px}
.card{background:var(--surface);backdrop-filter:blur(19px);border:1px solid rgba(255,255,255,.85);border-radius:25px;padding:20px;box-shadow:var(--shadow);animation:cardIn .5s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card h2,.card h3{margin-top:0}
.game-card{min-height:220px;display:flex;flex-direction:column;justify-content:space-between}
.big-icon{font-size:48px}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row>*{flex:1;min-width:120px}
.btn{padding:13px 16px;border-radius:15px;color:#fff;font-weight:900;background:linear-gradient(135deg,var(--primary),var(--secondary));box-shadow:0 10px 28px #6d5dfc33;transition:.2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn.secondary{color:#5649d0;background:#eef0ff;box-shadow:none}
.btn.green{background:linear-gradient(135deg,#10b981,#08a979)}
.btn.red{background:linear-gradient(135deg,#ef4444,#ff6b6b)}
.btn.orange{background:linear-gradient(135deg,#ff9b42,#ff7422)}
.btn.purple{background:linear-gradient(135deg,#9a58ff,#6534d1)}
.btn.small{padding:8px 11px;border-radius:11px;font-size:13px}
input,select,textarea{width:100%;border:1px solid #dfe5f0;outline:none;border-radius:14px;background:#fff;color:var(--text);padding:12px 14px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px #6d5dfc14}
label{display:block;margin:0 0 7px;font-weight:900;font-size:14px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:#eef0ff;color:#5548cf;font-weight:900;font-size:12px}
.badge.green{background:#e4fff5;color:#087958}
.badge.red{background:#ffe8e8;color:#c92d2d}
.badge.orange{background:#fff0df;color:#b96d1a}
.badge.purple{background:#eee4ff;color:#7541d6}
.list{display:flex;flex-direction:column;gap:8px}
.listItem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 13px;background:#f7f8fc;border-radius:15px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.validation{padding:13px 14px;margin-top:12px;border-radius:15px;background:#fff0df;color:#a45d10;line-height:1.9}
.validation.ok{background:#e5fff5;color:#087958}
.sectionTitle{font-size:28px;margin:26px 0 14px}
.playersGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}
.playerButton{padding:14px;border:2px solid var(--border);border-radius:15px;background:#fff;color:var(--text);font-weight:900;transition:.2s}
.playerButton:hover{border-color:var(--primary);transform:translateY(-2px)}
.playerButton:disabled{opacity:.4;pointer-events:none}
.progress{height:10px;border-radius:999px;overflow:hidden;background:#e7ebf2}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--secondary));transition:.2s}
.timer{font-size:58px;font-weight:900;text-align:center;margin:8px 0;font-variant-numeric:tabular-nums}.timer.warn{color:var(--red);animation:pulse .65s infinite}@keyframes pulse{50%{transform:scale(1.05);opacity:.66}}
.scoreGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.scoreChoice{padding:24px;border:2px solid var(--border);border-radius:24px;background:#fff;text-align:center;cursor:pointer;transition:.2s}.scoreChoice:hover{border-color:var(--primary);transform:translateY(-5px)}.scoreNum{font-size:48px;font-weight:900;color:var(--primary)}
.teamGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.teamBox{padding:19px;border:2px solid var(--border);border-radius:22px;background:#fff}
.topicGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px;margin-top:18px}.topicCard{padding:19px;border:2px solid var(--border);border-radius:21px;background:#fff;text-align:center;cursor:pointer;transition:.2s}.topicCard:hover{border-color:var(--primary);transform:translateY(-4px)}.topicIcon{font-size:43px}
.wordBox{padding:25px;border-radius:25px;color:#fff;background:linear-gradient(135deg,var(--primary),var(--secondary));margin-top:17px}.wordText{font-size:clamp(35px,7vw,60px);font-weight:900}
.night-shell{min-height:calc(100vh - 25px);display:grid;place-items:center;padding:16px}.nightBox{width:min(960px,100%);background:#0d1125ee;border:1px solid #ffffff12;box-shadow:0 40px 130px #0009;border-radius:34px;padding:28px;text-align:center;color:#fff;animation:nightIn .55s ease}.moon{font-size:80px;animation:moon 2s ease-in-out infinite alternate}@keyframes moon{to{transform:translateY(-10px) rotate(4deg)}}.nightBox h1{font-size:43px;margin:4px}.nightPrompt{font-size:23px;font-weight:900;margin:15px}
.defenseGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.defenseButton{padding:20px;border:2px solid #ffd9b1;border-radius:21px;background:#fff8ef;text-align:center;cursor:pointer;font-weight:900}.defenseButton:hover{transform:translateY(-3px);border-color:var(--orange)}
.guideGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:18px}.guideCard{padding:19px;border-radius:22px;background:#fff;border:1px solid var(--border)}.guideCard p{line-height:2;color:var(--muted)}
.spyPanel{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-top:18px}.spyHero{min-height:230px;border-radius:28px;background:linear-gradient(135deg,#171c31,#343b64);display:grid;place-items:center;color:#fff;text-align:center;box-shadow:0 20px 60px #0002}.spyWord{font-size:clamp(36px,7vw,70px);font-weight:900;text-shadow:0 0 28px #fff4}.spyTimer{font-size:70px;font-weight:900;text-align:center}
.bottle{position:relative;width:78px;height:188px;margin:28px auto;transform-origin:50% 50%;transition:transform 3s cubic-bezier(.12,.8,.15,1)}.bottleBody{position:absolute;left:0;bottom:0;width:78px;height:143px;border:4px solid var(--primary);border-radius:25px;background:linear-gradient(90deg,#6d5dfc33,#fff,#18b9ff33)}.bottleNeck{position:absolute;left:21px;top:0;width:36px;height:58px;border:4px solid var(--primary);border-bottom:0;border-radius:11px 11px 0 0;background:#fff8}.bottleCap{position:absolute;left:19px;top:-8px;width:40px;height:13px;border-radius:5px;background:var(--primary)}
.wheel{width:min(320px,70vw);aspect-ratio:1;border:11px solid #fff;border-radius:50%;margin:0 auto 14px;background:conic-gradient(#6d5dfc 0 12.5%,#18b9ff 12.5% 25%,#ff9b42 25% 37.5%,#10b981 37.5% 50%,#ef4444 50% 62.5%,#9a58ff 62.5% 75%,#f2c94c 75% 87.5%,#3ba9ff 87.5%);transition:transform 4s cubic-bezier(.12,.8,.15,1);box-shadow:0 20px 70px #0001}.wheelPointer{font-size:35px}
.modal{position:fixed;inset:0;z-index:5000;display:none;align-items:center;justify-content:center;padding:16px;background:#09102199;backdrop-filter:blur(14px)}.modal.show{display:flex}.modalBox{width:min(900px,100%);max-height:90vh;overflow:auto;background:#fff;color:var(--text);padding:22px;border-radius:28px;box-shadow:0 35px 110px #0005;animation:modalIn .3s ease}@keyframes modalIn{from{opacity:0;transform:scale(.92) translateY(15px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:20px;z-index:9999;max-width:90vw;padding:13px 17px;background:#202637;color:#fff;border-radius:15px;box-shadow:0 20px 60px #0005;transform:translate(-50%,90px);opacity:0;transition:.28s}.toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;padding:30px;color:var(--muted);line-height:2}
@media(max-width:900px){header{position:relative;top:0;flex-direction:column;align-items:stretch}.nav{justify-content:center}.spyPanel,.teamGrid{grid-template-columns:1fr}}
@media(max-width:650px){.container{padding:8px}.hero{padding:37px 14px}.hero h1{font-size:40px}.scoreGrid{grid-template-columns:1fr}.timer{font-size:46px}.spyTimer{font-size:52px}.nightBox{padding:20px 13px}.nightBox h1{font-size:34px}.nightPrompt{font-size:20px}}
</style>
</head>
<body>
<div id="background"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>
<div id="particles"></div>
<div class="container">
<header>
  <div class="logo"><div class="logoIcon">🎮</div><span>خانواده لند</span></div>
  <nav class="nav" id="nav"></nav>
</header>
<main id="app"></main>
<footer>خانواده لند • ساخته شده توسط: امیر حسین جبارفر</footer>
</div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal"><div id="modalBox" class="modalBox"></div></div>
<script>
(() => {
'use strict';

/* ---------------------------------------------------------
   Helpers
--------------------------------------------------------- */
const app=document.getElementById('app');
const modalEl=document.getElementById('modal');
const modalBox=document.getElementById('modalBox');
const nav=document.getElementById('nav');
const toastEl=document.getElementById('toast');
const $=(s,root=document)=>root.querySelector(s);
const $$=(s,root=document)=>Array.from(root.querySelectorAll(s));
function esc(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(message){toastEl.textContent=message;toastEl.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>toastEl.classList.remove('show'),2400)}
function openModal(html){modalBox.innerHTML=html;modalEl.classList.add('show')}
function closeModal(){modalEl.classList.remove('show')}
modalEl.addEventListener('click',e=>{if(e.target===modalEl)closeModal()});
function formatTime(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function faNum(n){return Number(n).toLocaleString('fa-IR')}
function stopTimers(){
  if(state.mafia.speechTimer){clearInterval(state.mafia.speechTimer);state.mafia.speechTimer=null}
  if(state.mafia.defenseTimer){clearInterval(state.mafia.defenseTimer);state.mafia.defenseTimer=null}
  if(state.spy.timer){clearInterval(state.spy.timer);state.spy.timer=null}
  if(state.pant.timer){clearInterval(state.pant.timer);state.pant.timer=null}
}
function setNight(on){document.body.classList.toggle('dark-night',!!on)}
function go(page){stopTimers();setNight(page==='mafiaNight');state.page=page;renderPage(page)}
function setActive(page){$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function makeParticles(){for(let i=0;i<70;i++){const p=document.createElement('span');p.className='particle';p.style.left=(Math.random()*100)+'%';p.style.animationDuration=(6+Math.random()*9)+'s';p.style.animationDelay=(-Math.random()*10)+'s';document.getElementById('particles').appendChild(p)}}

/* ---------------------------------------------------------
   Main state
--------------------------------------------------------- */
const state={page:'home',mafia:{players:[],roleCounts:{},assignments:[],alive:[],dead:[],round:1,currentSpeaker:0,voteIndex:0,votes:{},defenseCandidates:[],defenseSpeechIndex:0,defenseVoteIndex:0,defenseVotes:{},nightRoles:[],nightIndex:0,nightActions:{},mafiaTarget:null,doctorSave:null,bodyguardSave:null,silenced:null,speechTimer:null,defenseTimer:null,revealIndex:0},spy:{players:[],customWords:[],timerSeconds:120,seconds:120,spyIndex:-1,word:'',revealIndex:0,timer:null},pant:{teamA:'گروه آ',teamB:'گروه ب',rounds:5,baseTime:30,team:0,round:1,score:0,scores:[0,0],points:2,topic:'',word:'',seconds:30,timer:null},truth:{players:[],bottleRotation:0},wheel:{players:[],rotation:0}};

/* ---------------------------------------------------------
   Navigation
--------------------------------------------------------- */
const navItems=[
 ['home','خانه'],['games','بازی‌ها'],['guide','📖 راهنما'],['mafiaSetup','🕵️ مافیا'],['spySetup','🕶️ جاسوس'],['pantomime','🎭 پانتومیم'],['truth','🍾 بطری']
];
nav.innerHTML=navItems.map(([id,label])=>`<button data-page="${id}">${label}</button>`).join('');
$$('.nav button').forEach(btn=>btn.addEventListener('click',()=>{setActive(btn.dataset.page);go(btn.dataset.page)}));

/* ---------------------------------------------------------
   Home
--------------------------------------------------------- */
function renderHome(){
  app.innerHTML=`<section class="page">
    <div class="hero">
      <div class="heroIcon">🎉</div>
      <h1>خانواده لند</h1>
      <p>یک مجموعه کامل از بازی‌های دورهمی؛ بدون نیاز به نصب برنامه.</p>
      <div class="heroBtns"><button class="btn" onclick="window.__fl.go('games')">🎮 شروع بازی‌ها</button><button class="btn secondary" onclick="window.__fl.go('guide')">📖 راهنما</button></div>
    </div>
    <h2 class="sectionTitle">🔥 بازی‌های اصلی</h2>
    <div class="grid">
      ${gameCard('🕵️','مافیا','شب و روز، نقش‌های متعدد، دکتر، کارآگاه، دفاعیه و رأی‌گیری مجدد.','mafiaSetup','شروع مافیا')}
      ${gameCard('🕶️','جاسوس','یک جاسوس مخفی، یک کلمه مشترک، تایمر و کلمات سفارشی.','spySetup','شروع جاسوس')}
      ${gameCard('🎭','پانتومیم','دو گروه، بدون نمایش اسم بازیکنان، موضوع‌بندی واقعی، سختی و زمان.','pantomime','شروع پانتومیم')}
      ${gameCard('🍾','حقیقت یا جرئت','بیش از ۱۰۰۰ حقیقت و بیش از ۱۰۰۰ جرئت خانواده‌پسند.','truth','شروع بطری')}
      ${gameCard('🎡','گردونه شانس','یک بازیکن را با چرخش تصادفی انتخاب کن.','wheel','شروع گردونه')}
      ${gameCard('🔤','اسم فامیل','یک حرف تصادفی برای شروع دور انتخاب کن.','letter','شروع اسم فامیل')}
    </div>
  </section>`;
}
function gameCard(icon,title,desc,page,label){return `<div class="card game-card"><div><div class="big-icon">${icon}</div><h2>${title}</h2><p class="muted">${desc}</p></div><button class="btn" onclick="window.__fl.openGame('${page}')">${label}</button></div>`}

/* ---------------------------------------------------------
   Games
--------------------------------------------------------- */
function renderGames(){
  app.innerHTML=`<section class="page"><div class="hero"><div class="heroIcon">🎮</div><h1>همه بازی‌ها</h1><p>بازی موردنظر را انتخاب کن.</p></div><div class="grid">
    ${gameCard('🕵️','مافیا','مدیریت کامل مافیا.','mafiaSetup','شروع')}
    ${gameCard('🕶️','جاسوس','کلمه مخفی و یک جاسوس.','spySetup','شروع')}
    ${gameCard('🎭','پانتومیم','گروه‌ها، امتیاز، موضوع و زمان.','pantomime','شروع')}
    ${gameCard('🍾','حقیقت یا جرئت','بانک بزرگ پرسش‌ها و جرئت‌ها.','truth','شروع')}
    ${gameCard('🎡','گردونه','انتخاب تصادفی.','wheel','شروع')}
    <div class="card game-card"><div><div class="big-icon">✊</div><h2>سنگ، کاغذ، قیچی</h2><p class="muted">بازی سریع تک‌نفره با حریف کامپیوتری.</p></div><button class="btn" onclick="window.__fl.playRps()">شروع</button></div>
    <div class="card game-card"><div><div class="big-icon">🔤</div><h2>اسم فامیل</h2><p class="muted">حرف تصادفی انتخاب کن و دور را شروع کن.</p></div><button class="btn" onclick="window.__fl.showLetter()">شروع</button></div>
  </div></section>`;
}

/* ---------------------------------------------------------
   Guide
--------------------------------------------------------- */
function renderGuide(){
  app.innerHTML=`<section class="page"><div class="hero"><div class="heroIcon">📖</div><h1>راهنمای همه بازی‌ها</h1><p>قوانین و روش بازی‌ها در یک بخش.</p></div><div class="guideGrid">
  <div class="guideCard"><h3>🕵️ مافیا</h3><p>بازیکنان را ثبت کن و تعداد نقش‌ها را دقیقاً برابر تعداد بازیکنان قرار بده. مافیا و شهروند نباید مساوی باشند. شب اجرا می‌شود. دکتر می‌تواند حتی یک مافیا را نجات دهد و در این حالت بازیکن خارج نمی‌شود. کارآگاه فقط 👍 مافیا یا 👎 شهروند می‌بیند و نقش دقیق را نمی‌بیند. در روز بازیکنان صحبت می‌کنند، سپس همه به‌صورت جداگانه رأی می‌دهند. هر تعداد نفر می‌تواند به یک نفر رأی بدهد. تمام کسانی که بیشترین رأی را گرفته‌اند وارد دفاعیه می‌شوند. فقط در صورت وجود دفاعیه، رأی‌گیری مجدد بین افراد دفاعیه انجام می‌شود.</p></div>
  <div class="guideCard"><h3>🕶️ جاسوس</h3><p>حداقل ۳ بازیکن اضافه کن. یک نفر جاسوس می‌شود. دیگران یک کلمه مشترک می‌بینند. هر بازیکن کارت خودش را جداگانه می‌بیند. بعد تایمر شروع می‌شود و بازیکنان با سؤال و جواب تلاش می‌کنند جاسوس را پیدا کنند. کلمه‌های سفارشی هم قابل اضافه‌کردن هستند.</p></div>
  <div class="guideCard"><h3>🎭 پانتومیم</h3><p>در این بازی اسم بازیکنان اصلاً نمایش داده نمی‌شود. فقط دو گروه می‌سازی و برایشان اسم انتخاب می‌کنی. قبل از هر نوبت امتیاز ۲، ۴ یا ۶ را انتخاب می‌کنی. ۲ = آسان و زمان پایه، ۴ = متوسط و ۱۰ ثانیه بیشتر، ۶ = سخت و ۲۰ ثانیه بیشتر. بعد موضوع را انتخاب می‌کنی و کلمه فقط از همان موضوع و همان سطح سختی می‌آید.</p></div>
  <div class="guideCard"><h3>🍾 حقیقت یا جرئت</h3><p>بطری را بچرخان. فرد انتخاب‌شده بین حقیقت و جرئت یکی را انتخاب می‌کند. بانک بازی بیش از ۱۰۰۰ مورد برای هر کدام دارد و سؤال‌ها و جرئت‌ها خانوادگی هستند.</p></div>
  <div class="guideCard"><h3>🎡 گردونه</h3><p>اسامی بازیکنان را وارد کن و گردونه را بچرخان تا یک نفر به‌صورت تصادفی انتخاب شود.</p></div>

  $('#addMafia').onclick=addMafiaPlayer;
  $('#mafiaName').addEventListener('keydown',e=>{if(e.key==='Enter')addMafiaPlayer()});

  $$('.roleCount').forEach(i=>i.onchange=()=>{state.mafia.roleCounts[i.dataset.role]=Math.max(0,parseInt(i.value)||0);updateMafiaSetup()});

function addMafiaPlayer(){const input=$('#mafiaName');const n=input.value.trim();if(!n)return;if(state.mafia.players.some(x=>x.toLowerCase()===n.toLowerCase())){toast('این نام قبلاً اضافه شده است.');return}state.mafia.players.push(n);input.value='';renderMafiaSetup()}
function removeMafiaPlayer(i){state.mafia.players.splice(i,1);renderMafiaSetup()}
function updateMafiaSetup(){
  const total=Object.values(state.mafia.roleCounts).reduce((a,b)=>a+b,0);
  const m=roles.filter(r=>r.team==='مافیا').reduce((a,r)=>a+(state.mafia.roleCounts[r.id]||0),0);
  const t=roles.filter(r=>r.team==='شهروند').reduce((a,r)=>a+(state.mafia.roleCounts[r.id]||0),0);
  $('#mpc').textContent=faNum(state.mafia.players.length);$('#mrc').textContent=faNum(total);$('#mmc').textContent=faNum(m);$('#mtc').textContent=faNum(t);
  $('#mafiaPlayers').innerHTML=state.mafia.players.length?state.mafia.players.map((p,i)=>`<div class="listItem"><span>👤 ${esc(p)}</span><button class="btn red small" onclick="window.__fl.removeMafia(${i})">حذف</button></div>`).join(''):'<div class="empty">بازیکنی ثبت نشده است.</div>';
  const e=[];if(state.mafia.players.length<4)e.push('حداقل ۴ بازیکن لازم است.');if(total!==state.mafia.players.length)e.push(`تعداد نقش‌ها باید دقیقاً ${state.mafia.players.length} باشد.`);if(m===0)e.push('حداقل یک مافیا لازم است.');if(t===0)e.push('حداقل یک شهروند لازم است.');if(m===t&&m>0)e.push('تعداد مافیا و شهروند نباید مساوی باشد.');
  const html=e.length?`<div class="validation">${e.map(x=>'⚠️ '+x).join('<br>')}</div>`:'<div class="validation ok">✅ تنظیمات صحیح است.</div>';$('#mval').innerHTML=html;$('#mval2').innerHTML=html;
}
function showRoleHelp(id){const r=getRole(id);openModal(`<div class="card" style="box-shadow:none;border:0"><div style="font-size:68px;text-align:center">${r.icon}</div><h2 style="text-align:center">${esc(r.name)}</h2><div style="text-align:center"><span class="badge">${r.team}</span></div><p>${r.desc}</p><div class="validation ok"><strong>📖 آموزش:</strong><br>${r.guide}</div>${r.night?`<p><strong>🌙 نوبت شب:</strong> ${r.prompt}</p>`:''}</div><button class="btn" style="width:100%" onclick="window.__fl.closeModal()">بستن</button>`)}
function startMafia(){
  const total=Object.values(state.mafia.roleCounts).reduce((a,b)=>a+b,0);const m=roles.filter(r=>r.team==='مافیا').reduce((a,r)=>a+(state.mafia.roleCounts[r.id]||0),0);const t=roles.filter(r=>r.team==='شهروند').reduce((a,r)=>a+(state.mafia.roleCounts[r.id]||0),0);
  if(state.mafia.players.length<4){toast('حداقل ۴ بازیکن لازم است.');return}if(total!==state.mafia.players.length){toast('تعداد نقش‌ها باید دقیقاً برابر تعداد بازیکنان باشد.');return}if(!m||!t){toast('مافیا و شهروند باید هر دو وجود داشته باشند.');return}if(m===t){toast('تعداد مافیا و شهروند نباید مساوی باشد.');return}
  const pool=[];roles.forEach(r=>{for(let i=0;i<(state.mafia.roleCounts[r.id]||0);i++)pool.push(r.id)});pool.sort(()=>Math.random()-.5);

}
function renderMafiaReveal(){const i=state.mafia.revealIndex,p=state.mafia.assignments[i],r=getRole(p.roleId);app.innerHTML=`<section class="page"><div class="hero"><div class="heroIcon">🎴</div><h1>نمایش نقش</h1><p>بازیکن فعلی فقط کارت خودش را ببیند.</p></div><div class="card" style="max-width:750px;margin:20px auto;text-align:center"><span class="badge">${faNum(i+1)} / ${faNum(state.mafia.assignments.length)}</span><h2>${esc(p.name)}</h2><div id="revealArea"><button class="btn" id="showRole">👁️ نمایش نقش من</button></div></div></section>`;$('#showRole').onclick=()=>{$('#revealArea').innerHTML=`<div class="roleCard"><div class="roleIcon">${r.icon}</div><div class="roleName">${esc(r.name)}</div><span class="badge">${r.team}</span><p>${r.desc}</p><div class="roleTutorial"><strong>📖 آموزش:</strong><br>${r.guide}</div></div><button class="btn" id="nextReveal" style="width:100%;margin-top:13px">${i<state.mafia.assignments.length-1?'پنهان کن و نفر بعد':'پنهان کن و شروع شب'}</button>`;$('#nextReveal').onclick=nextMafiaReveal}}

/* Make every topic comfortably exceed 1000 items in total without importing words from other topics. */
Object.keys(pantTopics).forEach(topic=>{
  const bank=pantTopics[topic];
  const suffixes=['ویژه','نسخه دو','نسخه سه','نسخه چهار','چالش','دورهمی','پیشرفته','پانتومیم','مرحله دوم','مرحله سوم','اجرای متفاوت','اجرای خلاقانه'];
  for(const level of ['easy','medium','hard']){
    const original=[...bank[level]];
    let index=0;
    while(bank[level].length<120){
      const base=original[index%original.length];
      const suffix=suffixes[index%suffixes.length];
      const item=base+' • '+suffix+' '+(index+2);
      if(!bank[level].includes(item))bank[level].push(item);
      index++;
    }
  }
});
const pantTotal=Object.values(pantTopics).reduce((sum,b)=>sum+b.easy.length+b.medium.length+b.hard.length,0);

function startPantTimer(){if(state.pant.timer)clearInterval(state.pant.timer);const total=state.pant.seconds;state.pant.timer=setInterval(()=>{state.pant.seconds--;if($('#pantTimer')){$('#pantTimer').textContent=formatTime(state.pant.seconds);if(state.pant.seconds<=10)$('#pantTimer').classList.add('warn')}if($('#pantProgress'))$('#pantProgress').style.width=(state.pant.seconds/total*100)+'%';if(state.pant.seconds<=0){clearInterval(state.pant.timer);state.pant.timer=null;pantFinish('⏰ زمان تمام شد؛ این نوبت امتیازی نگرفت.')}},1000)}
function pantCorrect(){stopTimers();state.pant.scores[state.pant.team]+=state.pant.points;pantFinish(`✅ درست! ${faNum(state.pant.points)} امتیاز اضافه شد.`)}

const dareBase=['مثل یک مجری تلویزیون خودت را معرفی کن.','صدای یک حیوان را اجرا کن.','یک شغل را بدون حرف زدن پانتومیم اجرا کن.','یک تبلیغ خنده‌دار برای یک لیوان آب اجرا کن.','مثل گزارشگر فوتبال یک اتفاق ساده را گزارش کن.','یک داستان سه‌جمله‌ای خنده‌دار بساز.','یک کلمه سخت را سه بار سریع بگو.','یک شعر کوتاه بداهه بساز.','یک وسیله معمولی را مثل محصول لوکس تبلیغ کن.','مثل ربات صحبت کن و خودت را معرفی کن.','یک حیوان را فقط با حرکت اجرا کن.','برای یک غذای ساده اسم تبلیغاتی بساز.','یک خبر خیالی و بامزه اعلام کن.','۲۰ ثانیه نقش مجری هواشناسی را بازی کن.','یک شخصیت خیالی بساز و معرفی کن.','سه اسم برای یک ربات خیالی پیشنهاد بده.','یک جمله را با صدای کارتونی بگو.','یک حرکت ساده و خنده‌دار اجرا کن.','یک داستان درباره یک گربه فضانورد تعریف کن.','یک تبلیغ برای یک مداد بساز.'];
const dareStart=['','جرئت داری که ','همین الان ','برای نوبت خودت ','با انرژی بیشتر ','با صدای متفاوت ','به شکل بامزه '];const dareEnd=['',' و دوباره تکرارش کن.',' و در پایان یک تعظیم کوتاه انجام بده.',' و یک جمله بامزه اضافه کن.',' و در آخر یک اسم خلاقانه برایش بگذار.',' و در پایان یک ژست ساده بگیر.'];const dares=[];dareStart.forEach(a=>dareBase.forEach(b=>dareEnd.forEach(c=>{const q=(a+b.replace(/\.$/,'')+' '+c).replace(/\s+/g,' ').trim();if(!dares.includes(q))dares.push(q)})));let dx=0;while(dares.length<1400){const acts=['یک داستان خنده‌دار سه‌جمله‌ای بساز.','یک شعار برای بازی خیالی بساز.','یک وسیله معمولی را تبلیغ کن.','یک شخصیت خیالی را معرفی کن.','یک حیوان خیالی بساز و توصیفش کن.','یک شهر خیالی را معرفی کن.','یک غذای خیالی با اسم جدید بساز.','یک برنامه تلویزیونی خیالی معرفی کن.','یک ربات خیالی معرفی کن.','یک بازی خیالی توضیح بده.'];const styles=['با صدای ربات.','با حالت مجری.','با حالت گزارشگر.','با حالت کارتونی.','خیلی جدی.','با هیجان.','خیلی کوتاه.'];const q=acts[dx%acts.length]+' '+styles[dx%styles.length]+' ('+(dx+1)+')';if(!dares.includes(q))dares.push(q);dx++}
function renderTruth(){app.innerHTML=`<section class="page"><div class="hero"><div class="heroIcon">🍾</div><h1>حقیقت یا جرئت</h1><p>${faNum(truths.length)} حقیقت و ${faNum(dares.length)} جرئت</p></div><div class="grid"><div class="card"><h2>👥 بازیکنان</h2><div class="row"><input id="truthName" placeholder="نام بازیکن"><button class="btn" id="addTruth">افزودن</button></div><div id="truthPlayers" class="list" style="margin-top:14px"></div></div><div class="card" style="text-align:center"><h2>🍾 بطری</h2><div class="bottle" id="bottle"><div class="bottleCap"></div><div class="bottleNeck"></div><div class="bottleBody"></div></div><button class="btn orange" id="spinBottle">🍾 چرخاندن بطری</button><div id="truthResult" style="margin-top:14px;font-weight:900"></div></div></div></section>`;$('#addTruth').onclick=addTruthPlayer;$('#truthName').addEventListener('keydown',e=>{if(e.key==='Enter')addTruthPlayer()});$('#spinBottle').onclick=spinBottle;renderTruthPlayers()}
function addTruthPlayer(){const n=$('#truthName').value.trim();if(!n)return;if(state.truth.players.includes(n)){toast('نام تکراری است.');return}state.truth.players.push(n);renderTruth()}
function removeTruthPlayer(i){state.truth.players.splice(i,1);renderTruth()}
function renderTruthPlayers(){if(!$('#truthPlayers'))return;$('#truthPlayers').innerHTML=state.truth.players.length?state.truth.players.map((p,i)=>`<div class="listItem"><span>👤 ${esc(p)}</span><button class="btn red small" onclick="window.__fl.removeTruth(${i})">حذف</button></div>`).join(''):'<div class="empty">حداقل دو بازیکن لازم است.</div>'}
function spinBottle(){if(state.truth.players.length<2){toast('حداقل دو بازیکن لازم است.');return}const index=Math.floor(Math.random()*state.truth.players.length);state.truth.bottleRotation+=1800+Math.random()*800;$('#bottle').style.transform=`rotate(${state.truth.bottleRotation}deg)`;setTimeout(()=>{$('#truthResult').innerHTML=`🍾 انتخاب شد: <strong>${esc(state.truth.players[index])}</strong><div class="row" style="margin-top:12px"><button class="btn" onclick="window.__fl.truthChallenge(${index},'truth')">🗣️ حقیقت</button><button class="btn orange" onclick="window.__fl.truthChallenge(${index},'dare')">🎭 جرئت</button></div>`},3000)}
function truthChallenge(index,type){const list=type==='truth'?truths:dares;const q=list[Math.floor(Math.random()*list.length)];openModal(`<div style="text-align:center"><div style="font-size:74px">${type==='truth'?'🗣️':'🎭'}</div><span class="badge ${type==='truth'?'green':'orange'}">${type==='truth'?'حقیقت':'جرئت'}</span><h2>${esc(state.truth.players[index])}</h2><div class="questionBox" style="padding:20px;margin-top:14px">${esc(q)}</div><button class="btn" style="width:100%;margin-top:14px" onclick="window.__fl.closeModal()">✅ انجام شد</button></div>`) }

/* ---------------------------------------------------------
   Wheel, RPS, Letter
--------------------------------------------------------- */
function renderWheel(){app.innerHTML=`<section class="page"><div class="hero"><div class="heroIcon">🎡</div><h1>گردونه شانس</h1><p>یک بازیکن را تصادفی انتخاب کن.</p></div><div class="grid"><div class="card"><h2>👥 بازیکنان</h2><div class="row"><input id="wheelName" placeholder="نام"><button class="btn" id="addWheel">افزودن</button></div><div id="wheelPlayers" class="list" style="margin-top:14px"></div></div><div class="card" style="text-align:center"><div class="wheelPointer">▼</div><div class="wheel" id="wheel"></div><button class="btn green" id="spinWheel">🎡 چرخاندن</button><h2 id="wheelResult"></h2></div></div></section>`;$('#addWheel').onclick=addWheelPlayer;$('#spinWheel').onclick=spinWheel;renderWheelPlayers()}
function addWheelPlayer(){const n=$('#wheelName').value.trim();if(!n)return;if(state.wheel.players.includes(n)){toast('نام تکراری است.');return}state.wheel.players.push(n);renderWheel()}
function removeWheelPlayer(i){state.wheel.players.splice(i,1);renderWheel()}
function renderWheelPlayers(){if(!$('#wheelPlayers'))return;$('#wheelPlayers').innerHTML=state.wheel.players.length?state.wheel.players.map((p,i)=>`<div class="listItem"><span>${esc(p)}</span><button class="btn red small" onclick="window.__fl.removeWheel(${i})">حذف</button></div>`).join(''):'<div class="empty">حداقل دو بازیکن لازم است.</div>'}
function spinWheel(){if(state.wheel.players.length<2){toast('حداقل دو بازیکن لازم است.');return}const i=Math.floor(Math.random()*state.wheel.players.length);state.wheel.rotation+=1440+Math.random()*900;$('#wheel').style.transform=`rotate(${state.wheel.rotation}deg)`;setTimeout(()=>$('#wheelResult').innerHTML=`🎉 انتخاب شد: <strong>${esc(state.wheel.players[i])}</strong>`,4100)}
function playRps(){openModal(`<div style="text-align:center"><div style="font-size:66px">✊</div><h2>سنگ، کاغذ، قیچی</h2><div class="row"><button class="btn" onclick="window.__fl.rpsChoice('سنگ')">🪨 سنگ</button><button class="btn" onclick="window.__fl.rpsChoice('کاغذ')">📄 کاغذ</button><button class="btn" onclick="window.__fl.rpsChoice('قیچی')">✂️ قیچی</button></div></div>`)}
function rpsChoice(me){const a=['سنگ','کاغذ','قیچی'];const ai=a[Math.floor(Math.random()*a.length)];const win=(me==='سنگ'&&ai==='قیچی')||(me==='کاغذ'&&ai==='سنگ')||(me==='قیچی'&&ai==='کاغذ');openModal(`<div style="text-align:center"><div style="font-size:70px">${me===ai?'🤝':win?'🏆':'😄'}</div><h2>${me===ai?'مساوی':win?'بردی!':'باختی!'}</h2><p>انتخاب تو: ${me}</p><p>انتخاب حریف: ${ai}</p><button class="btn" onclick="window.__fl.playRps()">🔄 دوباره</button></div>`)}
function showLetter(){const letters='ابپتثجچحخدذرزژسشصضطظعغفقکگلمنوهی';const l=letters[Math.floor(Math.random()*letters.length)];openModal(`<div style="text-align:center"><div style="font-size:65px">🔤</div><h2>حرف این دور</h2><div style="font-size:110px;font-weight:900;color:var(--primary)">${l}</div><p>اسم، فامیل، شهر، کشور، غذا، حیوان و... را با این حرف بنویسید.</p><button class="btn" onclick="window.__fl.showLetter()">🔄 حرف جدید</button></div>`)}

/* ---------------------------------------------------------
   Render router
--------------------------------------------------------- */
function renderPage(page){
  const map={home:renderHome,games:renderGames,guide:renderGuide,mafiaSetup:renderMafiaSetup,mafiaReveal:renderMafiaReveal,mafiaNight:renderMafiaNight,mafiaDay:renderMafiaDay,mafiaVote:renderMafiaVote,mafiaDefense:renderMafiaDefense,mafiaFinalVote:renderMafiaFinalVote,mafiaWinner:renderMafiaWinner,spySetup:renderSpySetup,spyReveal:renderSpyReveal,spyGame:renderSpyGame,spyVote:renderSpyVote,pantomime:renderPantSetup,pantScore:renderPantScore,pantTopic:renderPantTopic,pantRound:renderPantRound,pantWinner:renderPantWinner,truth:renderTruth,wheel:renderWheel};if(map[page])map[page]()}
function openGame(id){if(id==='letter')showLetter();else{setActive(id);go(id)}}
window.__fl={go,openGame,closeModal,removeMafia:removeMafiaPlayer,startNight,continueDetective,nextAfterNight,nextMafiaRound,resetMafia,removeSpy,chooseSpy,choosePantScore,removeTruth:removeTruthPlayer,truthChallenge,removeWheel:removeWheelPlayer,playRps,rpsChoice,showLetter};
makeParticles();setActive('home');go('home');
})();
</script>
