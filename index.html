<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090817">
<title>خانواده لند | دنیای بازی‌های دورهمی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#080814;--panel:#111126;--panel2:#17172f;--line:#ffffff17;--text:#f7f4ff;--muted:#a6a2bd;--violet:#9b5cff;--cyan:#31e7e2;--pink:#ff4fa3;--red:#ff526b;--green:#48e0a4;--gold:#ffc76a;--shadow:0 25px 90px #0008}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#39205d55,transparent 38%),radial-gradient(ellipse at 90% 30%,#064d5650,transparent 35%),var(--bg);color:var(--text);font-family:'Vazirmatn',Tahoma,sans-serif;overflow-x:hidden}button,input,select{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
#ambient{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}.orb{position:absolute;width:38vw;height:38vw;min-width:230px;min-height:230px;border-radius:50%;filter:blur(95px);opacity:.16;animation:drift 16s ease-in-out infinite alternate}.orb.one{background:#a24dff;top:-15%;right:-10%}.orb.two{background:#00dcd5;bottom:-18%;left:-12%;animation-delay:-5s}.orb.three{background:#ff398c;top:45%;left:42%;width:20vw;height:20vw;animation-delay:-9s}@keyframes drift{to{transform:translate(55px,65px) scale(1.2)}}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff9 1px,transparent 1px);background-size:65px 65px;opacity:.12;animation:starMove 35s linear infinite}@keyframes starMove{to{background-position:130px 130px}}
.shell{width:min(1250px,100%);margin:auto;padding:18px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 17px;border:1px solid var(--line);border-radius:22px;background:#111126bb;backdrop-filter:blur(22px);box-shadow:var(--shadow);position:sticky;top:10px;z-index:50}.brand{display:flex;align-items:center;gap:12px;font:32px Lalezar}.brandmark{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(140deg,var(--violet),var(--cyan));box-shadow:0 0 30px #9b5cff55;font:26px Lalezar}.nav{display:flex;gap:6px;flex-wrap:wrap}.nav button{background:transparent;color:var(--muted);padding:9px 12px;border-radius:12px;font-weight:800;transition:.25s}.nav button:hover,.nav button.active{background:#ffffff12;color:white;box-shadow:inset 0 0 0 1px #ffffff1b}
.page{animation:pageEnter .55s cubic-bezier(.2,.8,.2,1)}@keyframes pageEnter{from{opacity:0;transform:translateY(20px);filter:blur(7px)}to{opacity:1;transform:none;filter:none}}.hero{position:relative;overflow:hidden;text-align:center;padding:65px 22px 58px;margin:22px 0;border:1px solid #ffffff20;border-radius:35px;background:linear-gradient(125deg,#21133d 0%,#171b3b 50%,#0d3339 100%);box-shadow:0 30px 100px #0007}.hero:before,.hero:after{content:"";position:absolute;border:1px solid #ffffff18;border-radius:50%;width:430px;height:430px;top:-260px;left:-100px;animation:rotate 24s linear infinite}.hero:after{width:330px;height:330px;top:auto;left:auto;right:-130px;bottom:-230px;animation-direction:reverse}@keyframes rotate{to{transform:rotate(360deg)}}.hero>*{position:relative;z-index:1}.eyebrow{font:19px Lalezar;color:var(--cyan);letter-spacing:1px}.hero h1{font:clamp(48px,8vw,88px)/1.1 Lalezar;margin:10px 0;text-shadow:0 0 40px #a45cff66}.hero p{color:#d1cde3;line-height:2;max-width:680px;margin:0 auto 20px}.heroMark{font:70px Lalezar;color:transparent;-webkit-text-stroke:1px #ffffff8c;text-shadow:0 0 35px #a65cff55}
h2,h3{font-family:Lalezar;font-weight:400}h2{font-size:29px;margin:0 0 12px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:28px 0 14px}.section-head h2{margin:0}.muted{color:var(--muted);line-height:1.9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:16px}.card{position:relative;padding:22px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(145deg,#17172fe8,#101022e8);box-shadow:0 18px 55px #0004;overflow:hidden;transition:transform .3s,border-color .3s,box-shadow .3s}.card:hover{transform:translateY(-5px);border-color:#a77aff66;box-shadow:0 24px 70px #0007,0 0 30px #9b5cff12}.game-card{min-height:225px;display:flex;flex-direction:column;justify-content:space-between}.game-symbol{font:54px Lalezar;color:var(--cyan);text-shadow:0 0 30px #31e7e255}.game-card h3{font-size:27px;margin:5px 0}.game-card p{font-size:13px;color:var(--muted);line-height:1.9}
.btn{padding:12px 18px;border-radius:14px;background:linear-gradient(115deg,var(--violet),#6652dc);color:white;font-weight:900;box-shadow:0 8px 26px #8753ff33;transition:.2s}.btn:hover{transform:translateY(-2px);filter:brightness(1.12)}.btn:active{transform:scale(.97)}.btn.cyan{background:linear-gradient(110deg,#10aaa9,#28d8ce);color:#041c20;box-shadow:0 8px 25px #31e7e233}.btn.red{background:linear-gradient(110deg,#ef405f,#a51f55)}.btn.green{background:linear-gradient(110deg,#16b982,#48e0a4);color:#05241b}.btn.gold{background:linear-gradient(110deg,#e9a943,#ffd486);color:#30200b}.btn.ghost{background:#ffffff0d;border:1px solid var(--line);box-shadow:none;color:#e9e5fa}.btn.small{padding:8px 12px;font-size:13px}.btn.full{width:100%}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:7px;color:#dcd7ef}.field input,.field select{width:100%;background:#090918;border:1px solid #ffffff22;border-radius:13px;padding:13px;color:white;outline:none}.field input:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #31e7e21c}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}.pill{display:inline-flex;padding:6px 11px;border-radius:50px;background:#ffffff10;border:1px solid var(--line);font-size:12px;color:#d8d2ec}.notice{padding:13px 15px;border:1px solid #31e7e233;background:#31e7e20b;border-radius:14px;color:#c8fffa;line-height:1.9;margin:12px 0}.list{display:grid;gap:8px}.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#ffffff08;border:1px solid #ffffff0d;padding:11px 13px;border-radius:13px}.empty{text-align:center;color:var(--muted);padding:20px}.separator{height:1px;background:var(--line);margin:18px 0}
.player-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}.player-chip{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:12px;border:1px solid var(--line);border-radius:13px;background:#ffffff08}.player-chip.dead{opacity:.42;text-decoration:line-through}.timer{font:clamp(45px,8vw,75px) Lalezar;text-align:center;color:var(--cyan);font-variant-numeric:tabular-nums;text-shadow:0 0 28px #31e7e255}.timer.danger{color:var(--red);animation:alarm .7s infinite}@keyframes alarm{50%{opacity:.5;transform:scale(1.04)}}.progress{height:8px;border-radius:20px;background:#ffffff12;overflow:hidden}.progress span{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));transition:width 1s linear}
.card-stage{perspective:1200px;width:min(270px,78vw);height:365px;margin:18px auto}.role-card{height:100%;width:100%;position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1);cursor:pointer}.role-card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:25px;border:1px solid #ffffff30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;overflow:hidden}.front{background:radial-gradient(circle at 50% 25%,#56338a,#17132c 65%,#0c1023);box-shadow:0 20px 60px #0008,0 0 40px #9b5cff22}.front:before{content:"";position:absolute;inset:12px;border:1px solid #ffffff30;border-radius:17px}.front .seal{font:90px Lalezar;color:transparent;-webkit-text-stroke:1px #bba3ff;text-shadow:0 0 30px #9b5cff88}.front strong{font:28px Lalezar}.front small{color:#c1b5e6;margin-top:8px}.back{transform:rotateY(180deg);background:radial-gradient(circle at 50% 15%,#244a55,#11172b 65%);box-shadow:0 20px 60px #0008}.back.mafia{background:radial-gradient(circle at 50% 15%,#6c233d,#241329 70%)}.back h2{font:38px Lalezar;margin:10px 0}.role-symbol{font:75px Lalezar;color:var(--gold);text-shadow:0 0 25px #ffc76a66}.flip-hint{text-align:center;color:var(--muted);font-size:13px}
.phasebar{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.phase{padding:8px 12px;border-radius:30px;background:#ffffff0a;border:1px solid var(--line);font-size:12px;color:var(--muted)}.phase.active{background:#9b5cff20;border-color:#a77aff88;color:#e5d5ff}.vote-option{width:100%;text-align:right;padding:13px;border:1px solid var(--line);border-radius:13px;background:#ffffff08;color:white;margin:5px 0;transition:.2s}.vote-option:hover{border-color:var(--cyan);background:#31e7e210}.vote-option.selected{border-color:var(--cyan);background:#31e7e21c}.result{padding:18px;border-radius:17px;background:#ffffff0a;border:1px solid var(--line);text-align:center;margin:12px 0}.result strong{font:30px Lalezar;color:var(--gold)}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.topic{padding:16px;text-align:center;border:1px solid var(--line);border-radius:16px;background:#ffffff08;color:white;transition:.2s}.topic:hover,.topic.selected{border-color:var(--cyan);background:#31e7e20e}.topic b{display:block;font:22px Lalezar}.word{font:clamp(30px,6vw,55px) Lalezar;color:var(--cyan);margin:15px 0}.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:10px}.score{padding:18px;text-align:center;border:1px solid var(--line);border-radius:18px;background:#ffffff08}.score strong{display:block;font:42px Lalezar;color:var(--gold)}
.wheel{width:min(300px,70vw);aspect-ratio:1;border-radius:50%;margin:15px auto;background:conic-gradient(#9b5cff 0 45deg,#31b9cb 45deg 90deg,#ff4fa3 90deg 135deg,#ffc76a 135deg 180deg,#5145a8 180deg 225deg,#20a78c 225deg 270deg,#a44e88 270deg 315deg,#38a7bc 315deg);border:9px solid #ffffffdd;box-shadow:0 0 55px #9b5cff33;transition:transform 4s cubic-bezier(.12,.8,.15,1)}
.modal{position:fixed;inset:0;z-index:200;background:#03030dcc;backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modal-box{width:min(580px,100%);max-height:88vh;overflow:auto;padding:24px;border-radius:25px;border:1px solid #ffffff25;background:#131329;box-shadow:var(--shadow);animation:pop .3s ease}@keyframes pop{from{opacity:0;transform:scale(.92) translateY(15px)}to{opacity:1;transform:none}}.toast{position:fixed;bottom:20px;left:50%;z-index:300;transform:translate(-50%,100px);opacity:0;background:#22213b;border:1px solid var(--line);padding:12px 18px;border-radius:13px;transition:.3s;box-shadow:var(--shadow);max-width:90vw}.toast.show{transform:translate(-50%,0);opacity:1}.result-symbol{font:70px Lalezar;color:var(--gold);animation:pop .6s ease;text-shadow:0 0 30px #ffc76a88}.winner-list{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.winner-chip{padding:10px 16px;border-radius:30px;background:#31e7e21a;border:1px solid #31e7e266}.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-10px;left:calc(var(--i)*4%);width:8px;height:13px;background:hsl(calc(var(--i)*31),90%,65%);animation:fall 1.4s ease-in forwards;animation-delay:calc(var(--i)*.03s)}@keyframes fall{to{transform:translateY(480px) rotate(720deg);opacity:0}}.turn-result{text-align:center;position:relative;animation:shakeGood .4s ease}@keyframes shakeGood{25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}.podium{display:flex;align-items:end;justify-content:center;gap:12px;margin:24px auto;max-width:600px}.podium-place{flex:1;padding:15px 8px;border:1px solid var(--line);border-radius:18px 18px 5px 5px;background:#ffffff0b;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:145px}.podium-place.place-0{min-height:210px;border-color:#ffc76a77;background:#ffc76a18}.podium-place strong{font:40px Lalezar;color:var(--gold)}.medal{font-size:36px}.ttt-board{display:grid;grid-template-columns:repeat(3,minmax(70px,105px));gap:9px;justify-content:center;margin:22px auto}.ttt-cell{aspect-ratio:1;border:1px solid #ffffff2b;border-radius:18px;background:#ffffff09;color:white;font:55px Lalezar;transition:.2s}.ttt-cell:hover{background:#31e7e21a;transform:scale(1.04)}.ttt-cell.x{color:var(--cyan)}.ttt-cell.o{color:var(--pink)}.bottle{width:180px;height:62px;margin:20px auto;border-radius:38px 12px 12px 38px;border:3px solid #b5f6ff;background:linear-gradient(90deg,#4ee6dd88,#a855f766);box-shadow:0 0 30px #31e7e255}.bottle.spin{animation:bottleSpin 1.2s ease-in-out}@keyframes bottleSpin{to{transform:rotate(1080deg)}}footer{text-align:center;padding:30px 10px;color:#79758e;font-size:12px}
@media(max-width:760px){.shell{padding:9px}.topbar{position:relative;top:0;flex-direction:column}.nav{justify-content:center}.nav button{padding:8px;font-size:12px}.hero{padding:45px 15px}.hero h1{font-size:52px}.card{padding:17px}.grid{grid-template-columns:1fr 1fr}.game-card{min-height:245px}.scoreboard{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.grid{grid-template-columns:1fr}.brand{font-size:28px}.hero h1{font-size:45px}.actions .btn{flex:1}.card-stage{height:340px}.player-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="ambient"><div class="orb one"></div><div class="orb two"></div><div class="orb three"></div><div class="stars"></div></div>
<div class="shell">
<header class="topbar"><div class="brand"><div class="brandmark">FL</div><span>خانواده لند</span></div><nav class="nav" id="nav"></nav></header>
<main id="app"></main>
<footer>FAMILY LAND · ساخته‌شده با خلاقیت امیر حسین جبارفر</footer>
</div>
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div><div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), app=$('#app'), nav=$('#nav'), modal=$('#modal'), modalBox=$('#modalBox');
const state={page:'home',mafia:{players:[],roles:[],alive:[],assign:[],index:0,phase:'',votes:{},night:{mafia:null,doctor:null,detective:null},day:1,defense:null,finalists:[]},spy:{players:[],assign:[],word:'',spy:-1,spies:[],spyCount:1,index:0,seconds:120,timer:null,selected:null,votes:{},voteIndex:0,guess:'',guessCorrect:false},pant:{players:[[],[]],names:['گروه آ','گروه ب'],team:0,round:1,rounds:5,seconds:60,total:60,score:[0,0],topic:'',difficulty:'متوسط',word:'',timer:null,used:[]},truth:{players:[],current:''},ttt:{players:['بازیکن ۱','بازیکن ۲'],board:Array(9).fill(''),turn:'X'},wheel:{players:[],rotation:0},rps:0};
const navItems=[['home','خانه'],['games','بازی‌ها'],['mafia','مافیا'],['spy','جاسوس'],['pant','پانتومیم'],['truth','حقیقت و جرئت']];
nav.innerHTML=navItems.map(x=>'<button data-page="'+x[0]+'">'+x[1]+'</button>').join('');
nav.addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),2400)}
function stopAll(){['spy','pant'].forEach(k=>{if(state[k].timer){clearInterval(state[k].timer);state[k].timer=null}})}
function go(p){stopAll();state.page=p;document.body.dataset.page=p;render();nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));window.scrollTo({top:0,behavior:'smooth'})}
function openModal(html){modalBox.innerHTML=html;modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
function header(kicker,title,desc){return '<section class="hero"><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1><p>'+desc+'</p></section>'}
function card(icon,title,desc,action,label){return '<article class="card game-card"><div><div class="game-symbol">'+icon+'</div><h3>'+title+'</h3><p>'+desc+'</p></div><button class="btn full" data-action="'+action+'">'+label+'</button></article>'}
function renderHome(){app.innerHTML='<section class="page">'+header('THE PARTY STARTS HERE','خانواده لند','دورهمی را به یک میدان رقابت، خنده و هیجان تبدیل کن. بازی‌ها را انتخاب کن و شروع کن.')+'<div class="section-head"><h2>بازی‌های خانواده لند</h2><span class="pill">نسخه بازطراحی‌شده</span></div><div class="grid">'+card('01','مافیا','شب و روز، نقش‌های ویژه، عملیات شبانه و رأی‌گیری چندمرحله‌ای.','mafia','ورود به مافیا')+card('02','جاسوس','کلمه مخفی، کارت‌های شانسی، زمان بحث و رأی‌گیری نهایی.','spy','شروع جاسوس')+card('03','پانتومیم','رقابت نوبتی دو گروه با موضوع، درجه سختی و امتیاز.','pant','شروع پانتومیم')+card('04','حقیقت یا جرئت','بانک متنوع پرسش‌ها و چالش‌های سرگرم‌کننده.','truth','ورود به بازی')+card('05','گردونه شانس','انتخاب تصادفی بازیکن با چرخش انیمیشنی.','wheel','چرخاندن گردونه')+card('06','سنگ، کاغذ، قیچی','یک رقابت سریع و کوتاه.','rps','بازی کن')+card('08','دوز','رقابت دونفره با علامت‌های X و O و انیمیشن برنده.','ttt','شروع دوز')+card('07','اسم‌فامیل','حرف تصادفی برای شروع یک دور تازه.','letter','انتخاب حرف')+'</div></section>'}
function renderGames(){renderHome()}
function render(){const routes={home:renderHome,games:renderGames,mafia:mafiaSetup,mafiaReveal:mafiaReveal,mafiaNight:mafiaNight,mafiaDay:mafiaDay,mafiaVote:mafiaVote,mafiaDefense:mafiaDefense,mafiaFinal:mafiaFinal,mafiaEnd:mafiaEnd,spy:spySetup,spyReveal:spyReveal,spyDiscuss:spyDiscuss,spyVote:spyVote,spyResult:spyResult,pant:pantSetup,pantLobby:pantLobby,pantTurn:pantTurn,pantEnd:pantEnd,truth:truthPage,ttt:tttPage,wheel:wheelPage,rps:rpsPage};(routes[state.page]||renderHome)()}
function setPage(p){state.page=p;render();nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));window.scrollTo({top:0,behavior:'smooth'})}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function random(a){return a[Math.floor(Math.random()*a.length)]}
function playerInput(id,label){return '<div class="row"><div class="field" style="flex:3"><input id="'+id+'" placeholder="'+label+'"></div><button class="btn cyan" data-action="add-'+id+'">افزودن بازیکن</button></div>'}
function playerList(list,removeAction){return '<div class="player-grid">'+list.map((n,i)=>'<div class="player-chip"><span>'+esc(n)+'</span><button class="btn red small" data-action="'+removeAction+'" data-index="'+i+'">×</button></div>').join('')+'</div>'}
function addName(input,list,min=1){const el=$('#'+input),n=el.value.trim();if(!n)return toast('نام بازیکن را وارد کن.');if(list.includes(n))return toast('این نام قبلاً اضافه شده است.');list.push(n);el.value='';render()}
const mafiaRoles=[['شهروند',1,'شهروند'],['مافیا',1,'مافیا'],['پزشک',1,'شهروند'],['کارآگاه',1,'شهروند'],['محافظ',1,'شهروند'],['تک‌تیرانداز',1,'شهروند'],['روان‌شناس',1,'شهروند'],['مذاکره‌کننده',1,'مافیا']];

function resolveNight(){const m=state.mafia,n=m.night;let msg='شب آرامی بود؛ کسی حذف نشد.';if(n.mafia&&n.mafia!==n.doctor){const p=m.alive.find(x=>x.name===n.mafia);if(p){p.alive=false;msg='در شب گذشته '+p.name+' از بازی خارج شد.'}}if(n.detective){const p=m.alive.find(x=>x.name===n.detective);toast('نتیجه کارآگاه: '+p.name+' در تیم '+p.team+' است.')}m.night={mafia:null,doctor:null,detective:null};m.lastNight=msg;if(checkMafiaEnd())return setPage('mafiaEnd');setPage('mafiaDay')}

function spyTimerStart(){const s=state.spy;if(s.timer)return;s.timer=setInterval(()=>{s.seconds--;const el=$('#spyTimer');if(el){el.textContent=fmt(s.seconds);el.classList.toggle('danger',s.seconds<=10)}const p=$('#spyProgress');if(p)p.style.width=(s.seconds/Number($('#spyDuration')?.value||120)*100)+'%';if(s.seconds<=0){clearInterval(s.timer);s.timer=null;toast('زمان گفت‌وگو تمام شد.');setPage('spyVote')}},1000)}

function spyVote(){spyTimerPause();const s=state.spy;s.votes={};s.voteIndex=0;spyVoteTurn()}
function spyVoteTurn(){const s=state.spy;if(s.voteIndex>=s.players.length)return spyResult();const voter=s.players[s.voteIndex];app.innerHTML='<section class="page">'+header('IDENTIFY THE SPY','رأی‌گیری','هر بازیکن به‌نوبت و مخفیانه به فرد مشکوک رأی می‌دهد.')+'<div class="card"><span class="pill">رأی '+(s.voteIndex+1)+' از '+s.players.length+'</span><h2>'+esc(voter)+'</h2>'+s.players.filter(n=>n!==voter).map(n=>'<button class="vote-option" data-action="spy-cast" data-name="'+esc(n)+'">'+esc(n)+'</button>').join('')+'</div></section>'}

function spySetup(){const s=state.spy;app.innerHTML='<section class="page">'+header('SECRET WORD MISSION','جاسوس','تعداد جاسوس‌ها را انتخاب کن؛ در پایان باید کلمه مخفی را تایپ کنند.')+'<div class="grid"><div class="card"><h2>بازیکنان</h2>'+playerInput('spyName','نام بازیکن')+(s.players.length?playerList(s.players,'remove-spy'):'<div class="empty">حداقل ۴ نفر لازم است.</div>')+'</div><div class="card"><h2>تنظیم مأموریت</h2><div class="field"><label>تعداد جاسوس‌ها</label><input id="spyCount" type="number" min="1" max="'+Math.max(1,s.players.length-1)+'" value="'+(s.spyCount||1)+'"></div><div class="field"><label>مدت گفت‌وگو</label><select id="spyDuration"><option value="60">۱ دقیقه</option><option value="90">۱:۳۰ دقیقه</option><option value="120" selected>۲ دقیقه</option><option value="180">۳ دقیقه</option><option value="300">۵ دقیقه</option></select></div><div class="field"><label>دسته کلمات</label><select id="spyCategory"><option value="all">همه دسته‌ها</option><option value="food">خوراکی‌ها</option><option value="place">مکان‌ها</option><option value="object">وسایل</option><option value="nature">طبیعت</option><option value="job">شغل‌ها</option><option value="sport">ورزش</option></select></div><button class="btn cyan full" data-action="spy-start">ساخت مأموریت تصادفی</button></div></div></section>'}
function startSpy(){const s=state.spy;if(s.players.length<4)return toast('حداقل ۴ بازیکن اضافه کن.');const count=Math.floor(Number($('#spyCount').value));if(count<1||count>=s.players.length)return toast('تعداد جاسوس باید حداقل ۱ و کمتر از تعداد بازیکنان باشد.');const cat=$('#spyCategory').value,bank=cat==='all'?Object.values(words).flat():words[cat];s.word=random(bank);s.spies=shuffle(s.players.map((_,i)=>i)).slice(0,count);s.spy=s.spies[0];s.assign=s.players.map((n,i)=>({name:n,spy:s.spies.includes(i)}));s.spyCount=count;s.index=0;s.seconds=Number($('#spyDuration').value);s.votes={};setPage('spyReveal')}
function spyVoteTurn(){const s=state.spy;if(s.voteIndex>=s.players.length)return spyGuess();const voter=s.players[s.voteIndex];app.innerHTML='<section class="page">'+header('IDENTIFY THE SPY','رأی‌گیری','هر بازیکن به‌نوبت و مخفیانه رأی می‌دهد.')+'<div class="card"><span class="pill">رأی '+(s.voteIndex+1)+' از '+s.players.length+'</span><h2>'+esc(voter)+'</h2>'+s.players.filter(n=>n!==voter).map(n=>'<button class="vote-option" data-action="spy-cast" data-name="'+esc(n)+'">'+esc(n)+'</button>').join('')+'</div></section>'}
function spyCast(name){const s=state.spy;s.votes[s.players[s.voteIndex]]=name;s.voteIndex++;spyVoteTurn()}
function spyGuess(){const s=state.spy;app.innerHTML='<section class="page">'+header('FINAL CHALLENGE','حدس نهایی','جاسوس‌ها باید کلمه مخفی را دقیق تایپ کنند.')+'<div class="card"><div class="field"><label>کلمه مخفی</label><input id="spyGuessInput" placeholder="حدس نهایی..."></div><button class="btn cyan full" data-action="spy-submit-guess">ثبت حدس</button><button class="btn ghost full" data-action="spy-skip-guess">رد کردن حدس</button></div></section>'}
function spySubmitGuess(){const s=state.spy,g=$('#spyGuessInput').value;if(!g.trim())return toast('کلمه را وارد کن.');const norm=x=>String(x).replace(/[\u200c\sـ]/g,'').replace(/ي/g,'ی').replace(/ك/g,'ک');s.guess=g;s.guessCorrect=norm(g)===norm(s.word);spyResult()}
function spyResult(){const s=state.spy,res=tally(s.votes),top=res[0],caught=s.spies.some(i=>top&&top[0]===s.players[i]),spyWin=s.guessCorrect||!caught,winners=spyWin?s.spies.map(i=>s.players[i]):s.players.filter((_,i)=>!s.spies.includes(i));app.innerHTML='<section class="page">'+header('MISSION COMPLETE','نتیجه مأموریت','کلمه مخفی و برندگان این دور مشخص شدند.')+'<div class="card" style="text-align:center"><div class="result-symbol">'+(spyWin?'✦':'★')+'</div><h2>'+(spyWin?'پیروزی جاسوس‌ها!':'پیروزی شهروندها!')+'</h2><div class="result"><span class="pill">کلمه مخفی</span><div class="word">'+esc(s.word)+'</div></div><h2>برندگان</h2><div class="winner-list">'+winners.map(n=>'<span class="winner-chip">✦ '+esc(n)+'</span>').join('')+'</div><p class="muted">جاسوس‌ها: '+s.spies.map(i=>esc(s.players[i])).join('، ')+'</p><div class="actions"><button class="btn cyan full" data-action="spy-reset">بازی مجدد</button><button class="btn ghost full" data-action="go-home">ورود به منو</button></div></div></section>'}
function pantStart(){const p=state.pant;p.names=[$('#teamA').value.trim()||'گروه آ',$('#teamB').value.trim()||'گروه ب'];p.rounds=Number($('#pantRounds').value);p.total=Number($('#pantTime').value);p.score=[0,0];p.team=0;p.round=1;p.used=[];p.topic=p.topic||'همه موضوعات';pantNextWord()}
function pantEffectiveDifficulty(){const n=state.pant.score[state.pant.team];return n>=18?'سخت':n>=8?'متوسط':'آسان'}
function pantNextWord(){const p=state.pant;let bank=p.topic==='همه موضوعات'?Object.values(pantWords).flat():pantWords[p.topic]||Object.values(pantWords).flat();bank=bank.filter(w=>!p.used.includes(w));if(!bank.length){p.used=[];bank=p.topic==='همه موضوعات'?Object.values(pantWords).flat():pantWords[p.topic]||Object.values(pantWords).flat()}p.word=random(bank);p.used.push(p.word);p.seconds=p.total;p.difficulty=pantEffectiveDifficulty();setPage('pantLobby')}
function pantLobby(){const p=state.pant;app.innerHTML='<section class="page">'+header('CHARADES ARENA · ROUND '+p.round,'سالن پانتومیم','موضوع را انتخاب کنید؛ با دکمه آماده‌ام نوبت اجرا آغاز می‌شود.')+'<div class="card"><span class="pill">نوبت '+(p.team+1)+' · '+esc(p.names[p.team])+'</span><div class="scoreboard"><div class="score">'+esc(p.names[0])+'<strong>'+p.score[0]+'</strong></div><div class="score">'+esc(p.names[1])+'<strong>'+p.score[1]+'</strong></div></div><h2>انتخاب موضوع</h2><div class="topic-grid">'+['همه موضوعات',...Object.keys(pantWords)].map(t=>'<button class="topic '+(p.topic===t?'selected':'')+'" data-topic="'+t+'"><b>'+t+'</b></button>').join('')+'</div><div class="result"><span class="pill">سختی بر اساس امتیاز تیم</span><div class="word">'+p.difficulty+'</div></div><button class="btn cyan full" data-action="pant-ready">آماده‌ام</button><button class="btn ghost full" data-action="go-home">ورود به منو</button></div></section>'}
function pantReady(){setPage('pantTurn')}
function pantTurn(){const p=state.pant;app.innerHTML='<section class="page">'+header('ROUND '+p.round,'اجرای '+esc(p.names[p.team]),'فقط اجراکننده کلمه را ببیند؛ تایمر با دکمه شروع فعال می‌شود.')+'<div class="card" style="text-align:center"><span class="pill">'+esc(p.topic)+' · '+p.difficulty+'</span><div id="pantSecret" class="result"><button class="btn cyan" data-action="pant-show">نمایش کلمه</button></div><div class="timer" id="pantTimer">'+fmt(p.seconds)+'</div><div class="progress"><span id="pantProgress" style="width:100%"></span></div><div class="actions"><button class="btn cyan full" data-action="pant-timer-start">شروع تایمر</button><button class="btn green full" data-action="pant-correct">درست بود</button><button class="btn red full" data-action="pant-skip">غلط / رد کلمه</button><button class="btn ghost full" data-action="pant-pause">توقف تایمر</button></div><div class="scoreboard"><div class="score">'+esc(p.names[0])+'<strong>'+p.score[0]+'</strong></div><div class="score">'+esc(p.names[1])+'<strong>'+p.score[1]+'</strong></div></div></div></section>'}
function pantTimerStart(){const p=state.pant;if(p.timer)return;p.timer=setInterval(()=>{p.seconds--;const e=$('#pantTimer');if(e){e.textContent=fmt(p.seconds);e.classList.toggle('danger',p.seconds<=10)}const bar=$('#pantProgress');if(bar)bar.style.width=(p.seconds/p.total*100)+'%';if(p.seconds<=0){clearInterval(p.timer);p.timer=null;pantFinishTurn('زمان تمام شد؛ امتیازی ثبت نشد.',false)}},1000)}
function pantFinishTurn(msg,correct){const p=state.pant;if(p.timer){clearInterval(p.timer);p.timer=null}if(correct)p.score[p.team]+=(p.difficulty==='آسان'?2:p.difficulty==='سخت'?5:3);openModal('<div class="confetti">'+Array.from({length:24},(_,i)=>'<i style="--i:'+i+'"></i>').join('')+'</div><div class="turn-result"><div class="result-symbol">'+(correct?'✓':'×')+'</div><h2>'+msg+'</h2><div class="scoreboard"><div class="score">'+esc(p.names[0])+'<strong>'+p.score[0]+'</strong></div><div class="score">'+esc(p.names[1])+'<strong>'+p.score[1]+'</strong></div></div><button class="btn cyan full" data-action="pant-next">بازگشت به سالن</button></div>')}
function pantNext(){const p=state.pant;closeModal();p.team=1-p.team;if(p.team===0)p.round++;if(p.round>p.rounds)setPage('pantEnd');else pantNextWord()}
function pantEnd(){const p=state.pant,order=[0,1].sort((a,b)=>p.score[b]-p.score[a]);app.innerHTML='<section class="page">'+header('CHAMPIONS','قهرمانان پانتومیم','مسابقه تمام شد؛ مدال‌ها و سکوی قهرمانی')+'<div class="card" style="text-align:center"><div class="result-symbol">🏆</div><h2>'+(p.score[0]===p.score[1]?'بازی مساوی شد':'قهرمان: '+esc(p.names[order[0]]))+'</h2><div class="podium">'+order.map((id,i)=>'<div class="podium-place place-'+i+'"><div class="medal">'+(i?'🥈':'🥇')+'</div><b>'+esc(p.names[id])+'</b><strong>'+p.score[id]+'</strong><small>امتیاز</small></div>').join('')+'</div><div class="actions"><button class="btn cyan full" data-action="pant-reset">بازی مجدد</button><button class="btn ghost full" data-action="go-home">ورود به منو</button></div></div></section>'}
function tttPage(){const g=state.ttt,w=tttWinner(g.board);app.innerHTML='<section class="page">'+header('CLASSIC DUEL','بازی دوز','دو نفره؛ سه علامت پشت سر هم برنده است.')+'<div class="card" style="text-align:center"><div class="pill">'+(w?(w==='draw'?'مساوی':'برنده: '+esc(g.players[w==='X'?0:1])):'نوبت '+esc(g.players[g.turn==='X'?0:1])+' · '+g.turn)+'</div><div class="ttt-board">'+g.board.map((v,i)=>'<button class="ttt-cell '+(v?v.toLowerCase():'')+'" data-action="ttt-move" data-index="'+i+'">'+(v||'')+'</button>').join('')+'</div><div class="actions"><button class="btn cyan full" data-action="ttt-reset">بازی مجدد</button><button class="btn ghost full" data-action="go-home">ورود به منو</button></div></div></section>'}
const tttLines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function tttWinner(b){for(const l of tttLines)if(b[l[0]]&&l.every(i=>b[i]===b[l[0]]))return b[l[0]];return b.every(Boolean)?'draw':''}
function tttMove(i){const g=state.ttt;if(g.board[i]||tttWinner(g.board))return;g.board[i]=g.turn;g.turn=g.turn==='X'?'O':'X';tttPage();const w=tttWinner(g.board);if(w)openModal('<div class="turn-result"><div class="result-symbol">'+(w==='draw'?'＝':'✦')+'</div><h2>'+(w==='draw'?'مساوی شد!':'برنده: '+esc(g.players[w==='X'?0:1]))+'</h2><button class="btn cyan full" data-action="ttt-reset">دوباره بازی کن</button><button class="btn ghost full" data-action="go-home">ورود به منو</button></div>')}
function tttReset(){state.ttt.board=Array(9).fill('');state.ttt.turn='X';closeModal();tttPage()}

go('home');
})();
</script>
</body>
</html>
